server.address=127.0.0.1
server.port=8083
spring.application.name=boot-telemetry-lab
server.tomcat.threads.max=16
server.tomcat.accept-count=16
spring.datasource.url=jdbc:h2:mem:telemetry;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=250
management.endpoints.web.exposure.include=health,metrics,prometheus
management.tracing.sampling.probability=1
management.opentelemetry.tracing.export.otlp.endpoint=http://127.0.0.1:14318/v1/traces
management.opentelemetry.tracing.export.otlp.timeout=1s
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
logging.structured.format.console=ecs
lab.admission=false
lab.permits=2
