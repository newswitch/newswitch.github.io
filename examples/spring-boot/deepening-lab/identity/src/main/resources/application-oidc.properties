spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:18080/realms/boot-lab
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=task-web
spring.security.oauth2.client.registration.keycloak.client-secret=${LAB_CLIENT_SECRET:lab-browser-only-not-production}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,task:read
