name: go-gin-lab
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: gin_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: isolated-lab-only
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d gin_lab"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:8.10.2
    ports: ["127.0.0.1:16379:6379"]
  kafka:
    image: apache/kafka:4.1.0
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  collector:
    image: otel/opentelemetry-collector:0.140.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./deploy/collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["127.0.0.1:14318:4318"]
