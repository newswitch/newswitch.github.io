# Replace image with your verified image digest. Create the task-service-config
# Secret in the selected test namespace before applying; never commit real values.
apiVersion: batch/v1
kind: Job
metadata:
  name: task-service-migrate-v1
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry.example.com/task-service:replace-me
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: task-service-config
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-service-api
  template:
    metadata:
      labels:
        app: task-service-api
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: registry.example.com/task-service:replace-me
          envFrom:
            - secretRef:
                name: task-service-config
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: "250m", memory: "128Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: task-service-api
spec:
  selector:
    app: task-service-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service-worker
  template:
    metadata:
      labels:
        app: task-service-worker
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: registry.example.com/task-service:replace-me
          command: ["python", "-m", "task_service.cli", "worker"]
          envFrom:
            - secretRef:
                name: task-service-config
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "1", memory: "512Mi"}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
