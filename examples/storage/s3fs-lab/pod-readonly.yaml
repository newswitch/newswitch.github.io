apiVersion: v1
kind: Pod
metadata:
  name: s3fs-readonly-lab
  namespace: storage-lab
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 30
  nodeSelector:
    kubernetes.io/os: linux
    storage.example.com/fuse-lab: "true"
  containers:
    - name: s3fs
      image: registry.example.com/storage/s3fs-lab:1.97
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
        runAsUser: 0
      env:
        - name: S3_BUCKET
          value: your-owned-test-bucket
        - name: S3_ENDPOINT
          value: https://s3.lab.example.com
        - name: S3_REGION
          value: us-east-1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
          ephemeral-storage: 5Gi
      startupProbe:
        exec:
          command: ["/usr/bin/mountpoint", "-q", "/mnt/s3"]
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 45
      readinessProbe:
        exec:
          command: ["/usr/bin/timeout", "5", "/usr/bin/cat", "/mnt/s3/health/ready.txt"]
        periodSeconds: 15
        timeoutSeconds: 6
        failureThreshold: 3
      volumeMounts:
        - name: fuse-device
          mountPath: /dev/fuse
        - name: credentials
          mountPath: /run/s3-credentials
          readOnly: true
        - name: cache
          mountPath: /var/cache/s3fs
  volumes:
    - name: fuse-device
      hostPath:
        path: /dev/fuse
        type: CharDevice
    - name: credentials
      secret:
        secretName: s3fs-credentials
        defaultMode: 256  # Decimal representation of octal 0400.
    - name: cache
      emptyDir:
        sizeLimit: 4Gi
