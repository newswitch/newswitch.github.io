name: java-components-jdbc-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: component_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local-lab-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d component_lab"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - jdbc-dev-data:/var/lib/postgresql/data
volumes:
  jdbc-dev-data:
