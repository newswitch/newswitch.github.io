<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Rubin GPU 双计算 Die、HBM4、L2、TMA 与外部互联关系</title>
  <desc id="desc">教学逻辑图。两个计算 Die 通过 NV-HBI 组成统一 GPU，向下连接 L2、TMA 与 HBM4，向外通过 NVLink-C2C、NVLink 6 和 PCIe 6.0 通信。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6f3"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf7ff"/>
      <stop offset="1" stop-color="#dceeff"/>
    </linearGradient>
    <linearGradient id="hbm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebf8ef"/>
      <stop offset="1" stop-color="#d8f0e0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f2742" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5c99"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#23845d"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #102a43; }
      .title { font-size: 34px; font-weight: 700; fill: #fff; }
      .subtitle { font-size: 17px; fill: #cfe2f3; }
      .section { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; fill: #486581; }
      .tiny { font-size: 13px; fill: #5d7285; }
      .value { font-size: 17px; font-weight: 700; fill: #174f77; }
      .box { stroke-width: 2; rx: 14; }
      .link { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <rect x="18" y="18" width="1564" height="90" rx="16" fill="#102a43"/>
  <text class="cn title" x="54" y="60">NVIDIA Rubin GPU：从双 Die 到 HBM4 与外部互联</text>
  <text class="cn subtitle" x="54" y="89">教学逻辑结构 · 表示组件关系和数据方向，不表示真实 Die Floorplan 或物理比例</text>

  <g class="cn">
    <line x1="70" y1="142" x2="124" y2="142" stroke="#7b3fc7" stroke-width="6"/>
    <text class="small" x="137" y="148">NV-HBI：封装内 Die-to-Die</text>
    <line x1="440" y1="142" x2="494" y2="142" stroke="#23845d" stroke-width="6"/>
    <text class="small" x="507" y="148">HBM4 本地显存路径</text>
    <line x1="780" y1="142" x2="834" y2="142" stroke="#1f5c99" stroke-width="6"/>
    <text class="small" x="847" y="148">外部高速互联</text>
    <rect x="1138" y="128" width="28" height="28" rx="6" fill="#ffefd0" stroke="#c47a13" stroke-width="2"/>
    <text class="small" x="1178" y="148">控制、调度与管理逻辑</text>
  </g>

  <rect x="55" y="182" width="1490" height="720" rx="30" fill="#fff" stroke="#9fb8cc" stroke-width="2" filter="url(#shadow)"/>
  <text class="cn section" x="86" y="225">单颗逻辑 Rubin GPU · 3360 亿晶体管 · 224 SM · 896 Tensor Core</text>

  <g class="cn">
    <rect class="box" x="90" y="260" width="610" height="350" fill="url(#die)" stroke="#2977b8"/>
    <text class="section" x="395" y="300" text-anchor="middle">Compute Die 0（计算 Die 0）</text>
    <text class="small" x="395" y="326" text-anchor="middle">GPC、SM、Tensor Core 与本地执行管线</text>

    <rect x="120" y="352" width="250" height="105" rx="12" fill="#fff" stroke="#5b95c7" stroke-width="2"/>
    <text class="label" x="245" y="386" text-anchor="middle">GPC Group A</text>
    <text class="small" x="245" y="415" text-anchor="middle">多个 GPC</text>
    <text class="small" x="245" y="440" text-anchor="middle">每个 GPC 组织若干 SM</text>

    <rect x="420" y="352" width="250" height="105" rx="12" fill="#fff" stroke="#5b95c7" stroke-width="2"/>
    <text class="label" x="545" y="386" text-anchor="middle">GPC Group B</text>
    <text class="small" x="545" y="415" text-anchor="middle">多个 GPC</text>
    <text class="small" x="545" y="440" text-anchor="middle">并行执行 Thread Block</text>

    <rect x="120" y="484" width="550" height="90" rx="12" fill="#d8ecff" stroke="#2977b8" stroke-width="2"/>
    <text class="label" x="395" y="517" text-anchor="middle">SM（Streaming Multiprocessor）</text>
    <text class="small" x="395" y="545" text-anchor="middle">Warp Scheduler · Register · Shared Memory · Load/Store</text>
    <text class="tiny" x="395" y="565" text-anchor="middle">每个 SM 配置 4 个 Tensor Core；图中只画逻辑层次</text>

    <rect class="box" x="900" y="260" width="610" height="350" fill="url(#die)" stroke="#2977b8"/>
    <text class="section" x="1205" y="300" text-anchor="middle">Compute Die 1（计算 Die 1）</text>
    <text class="small" x="1205" y="326" text-anchor="middle">与 Die 0 共同组成一个 CUDA 设备</text>

    <rect x="930" y="352" width="250" height="105" rx="12" fill="#fff" stroke="#5b95c7" stroke-width="2"/>
    <text class="label" x="1055" y="386" text-anchor="middle">GPC Group C</text>
    <text class="small" x="1055" y="415" text-anchor="middle">多个 GPC</text>
    <text class="small" x="1055" y="440" text-anchor="middle">并行执行 Thread Block</text>

    <rect x="1230" y="352" width="250" height="105" rx="12" fill="#fff" stroke="#5b95c7" stroke-width="2"/>
    <text class="label" x="1355" y="386" text-anchor="middle">GPC Group D</text>
    <text class="small" x="1355" y="415" text-anchor="middle">多个 GPC</text>
    <text class="small" x="1355" y="440" text-anchor="middle">并行执行 Thread Block</text>

    <rect x="930" y="484" width="550" height="90" rx="12" fill="#d8ecff" stroke="#2977b8" stroke-width="2"/>
    <text class="label" x="1205" y="517" text-anchor="middle">SM（Streaming Multiprocessor）</text>
    <text class="small" x="1205" y="545" text-anchor="middle">CUDA/Tensor/Load-Store/特殊函数等执行管线</text>
    <text class="tiny" x="1205" y="565" text-anchor="middle">224 SM 和 896 Tensor Core 为整颗 GPU 合计</text>
  </g>

  <g class="cn">
    <rect x="716" y="318" width="168" height="206" rx="18" fill="#f3e9ff" stroke="#7b3fc7" stroke-width="3"/>
    <text class="label" x="800" y="363" text-anchor="middle">NV-HBI</text>
    <text class="small" x="800" y="394" text-anchor="middle">高带宽 Die 间接口</text>
    <path d="M700 410 H716 M884 410 H900" class="link" stroke="#7b3fc7" stroke-width="7"/>
    <text class="small" x="800" y="445" text-anchor="middle">封装内部</text>
    <text class="small" x="800" y="471" text-anchor="middle">不是 NVLink 6</text>
    <text class="small" x="800" y="497" text-anchor="middle">不是两张独立 GPU</text>
  </g>

  <g class="cn">
    <rect x="90" y="646" width="1420" height="104" rx="16" fill="#edf2f7" stroke="#6f8799" stroke-width="2"/>
    <text class="label" x="800" y="681" text-anchor="middle">集中式 L2 Cache 与片上互连</text>
    <text class="small" x="800" y="710" text-anchor="middle">汇聚两个 Compute Die 对 HBM4、Peer 与 Host 的访问 · 缓存命中可减少外部数据搬运</text>
    <text class="tiny" x="800" y="735" text-anchor="middle">“集中式”表示逻辑功能层，图中不推断未公开的物理分区和容量</text>
    <path d="M395 610 V646 M1205 610 V646" class="link" stroke="#5b7488" stroke-width="4" marker-end="url(#arrowBlue)"/>
  </g>

  <g class="cn">
    <rect x="90" y="780" width="330" height="86" rx="14" fill="#ffefd0" stroke="#c47a13" stroke-width="2"/>
    <text class="label" x="255" y="813" text-anchor="middle">GigaThread Engine</text>
    <text class="small" x="255" y="841" text-anchor="middle">全局工作分发与协调</text>

    <rect x="455" y="780" width="330" height="86" rx="14" fill="#e5f6ef" stroke="#23845d" stroke-width="2"/>
    <text class="label" x="620" y="813" text-anchor="middle">Enhanced TMA</text>
    <text class="small" x="620" y="841" text-anchor="middle">多维 Tensor 异步搬运</text>

    <rect x="815" y="780" width="330" height="86" rx="14" fill="#ffefd0" stroke="#c47a13" stroke-width="2"/>
    <text class="label" x="980" y="813" text-anchor="middle">MIG Control</text>
    <text class="small" x="980" y="841" text-anchor="middle">设备分区、隔离与管理</text>

    <rect x="1180" y="780" width="330" height="86" rx="14" fill="#ffefd0" stroke="#c47a13" stroke-width="2"/>
    <text class="label" x="1345" y="813" text-anchor="middle">NVDEC / RAS / TEE-I/O</text>
    <text class="small" x="1345" y="841" text-anchor="middle">媒体、可靠性与安全能力</text>
  </g>

  <g class="cn">
    <rect x="55" y="932" width="700" height="150" rx="24" fill="url(#hbm)" stroke="#23845d" stroke-width="2" filter="url(#shadow)"/>
    <text class="section" x="405" y="971" text-anchor="middle">HBM4 本地显存子系统</text>
    <text class="value" x="405" y="1005" text-anchor="middle">最高 288 GB 容量 · 最高 22 TB/s 峰值带宽</text>
    <text class="small" x="405" y="1038" text-anchor="middle">Weight · Activation · KV Cache · Workspace · 通信 Buffer</text>
    <text class="tiny" x="405" y="1063" text-anchor="middle">容量决定能放多少；带宽决定本地显存与 GPU 每秒能搬多少</text>
    <path d="M620 866 V918 H405 V932" class="link" stroke="#23845d" stroke-width="5" marker-end="url(#arrowGreen)"/>
  </g>

  <g class="cn">
    <rect x="790" y="932" width="755" height="150" rx="24" fill="#eef5ff" stroke="#1f5c99" stroke-width="2" filter="url(#shadow)"/>
    <text class="section" x="1168" y="971" text-anchor="middle">GPU 外部互联</text>
    <rect x="818" y="996" width="210" height="60" rx="11" fill="#fff" stroke="#1f5c99" stroke-width="2"/>
    <text class="label" x="923" y="1021" text-anchor="middle">NVLink-C2C</text>
    <text class="tiny" x="923" y="1044" text-anchor="middle">Vera CPU · 1.8 TB/s</text>
    <rect x="1058" y="996" width="220" height="60" rx="11" fill="#fff" stroke="#1f5c99" stroke-width="2"/>
    <text class="label" x="1168" y="1021" text-anchor="middle">NVLink 6</text>
    <text class="tiny" x="1168" y="1044" text-anchor="middle">Scale-Up · 3.6 TB/s/GPU</text>
    <rect x="1308" y="996" width="209" height="60" rx="11" fill="#fff" stroke="#1f5c99" stroke-width="2"/>
    <text class="label" x="1413" y="1021" text-anchor="middle">PCIe 6.0 x16</text>
    <text class="tiny" x="1413" y="1044" text-anchor="middle">Host · 256 GB/s 双向聚合</text>
    <path d="M1345 866 V910 H1168 V932" class="link" stroke="#1f5c99" stroke-width="5" marker-end="url(#arrowBlue)"/>
  </g>
</svg>
