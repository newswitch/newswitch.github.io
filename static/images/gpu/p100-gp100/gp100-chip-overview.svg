<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">GP100 芯片逻辑结构</title>
  <desc id="desc">展示六个 GPC、SM、全芯片互连、L2 缓存、八个显存控制器、四组 HBM2、PCIe 3.0 x16 和四条 NVLink 1.0 的逻辑关系。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dce6ef" stroke-width="1" opacity=".7"/></pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18324d" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 1L10 5 0 9Z" fill="#235b91"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 1L10 5 0 9Z" fill="#bb475d"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#132f4c}.title{font-size:34px;font-weight:700;fill:#fff}.subtitle{font-size:18px;fill:#c9d8e8}.section{font-size:23px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#55708a}.micro{font-size:13px;font-weight:700}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f8fbfd"/><rect y="100" width="1600" height="880" fill="url(#grid)"/>
  <rect width="1600" height="100" fill="#102b49"/>
  <text x="48" y="47" class="title">GP100 芯片：计算、缓存、显存与互联</text>
  <text x="48" y="77" class="subtitle">教学逻辑关系 · 不表示真实 Die Floorplan 的几何比例</text>

  <rect x="42" y="132" width="1516" height="790" rx="20" fill="#fff" stroke="#91a8bc" stroke-width="2" filter="url(#shadow)"/>
  <text x="72" y="172" class="section">① 计算阵列：6 个 GPC，完整设计最多 60 个 SM</text>
  <text x="1518" y="171" class="small" text-anchor="end">Tesla P100 产品启用 56 SM，共 3584 个 FP32 CUDA Core</text>

  <!-- Six GPCs -->
  <g>
    <rect x="72" y="196" width="226" height="174" rx="14" fill="#edf6ff" stroke="#3d82bd" stroke-width="2"/>
    <text x="185" y="226" class="heading" text-anchor="middle">GPC 0</text>
    <text x="185" y="250" class="small" text-anchor="middle">完整设计：10 SM</text>
    <g fill="#d6eaff" stroke="#5793c7"><rect x="94" y="272" width="34" height="28" rx="5"/><rect x="136" y="272" width="34" height="28" rx="5"/><rect x="178" y="272" width="34" height="28" rx="5"/><rect x="220" y="272" width="34" height="28" rx="5"/><rect x="262" y="272" width="34" height="28" rx="5"/><rect x="94" y="310" width="34" height="28" rx="5"/><rect x="136" y="310" width="34" height="28" rx="5"/><rect x="178" y="310" width="34" height="28" rx="5"/><rect x="220" y="310" width="34" height="28" rx="5"/><rect x="262" y="310" width="34" height="28" rx="5"/></g>
    <text x="185" y="356" class="small" text-anchor="middle">Block → Warp → SM</text>
  </g>
  <g>
    <rect x="318" y="196" width="226" height="174" rx="14" fill="#edf6ff" stroke="#3d82bd" stroke-width="2"/>
    <text x="431" y="226" class="heading" text-anchor="middle">GPC 1</text><text x="431" y="250" class="small" text-anchor="middle">完整设计：10 SM</text>
    <g fill="#d6eaff" stroke="#5793c7"><rect x="340" y="272" width="34" height="28" rx="5"/><rect x="382" y="272" width="34" height="28" rx="5"/><rect x="424" y="272" width="34" height="28" rx="5"/><rect x="466" y="272" width="34" height="28" rx="5"/><rect x="508" y="272" width="34" height="28" rx="5"/><rect x="340" y="310" width="34" height="28" rx="5"/><rect x="382" y="310" width="34" height="28" rx="5"/><rect x="424" y="310" width="34" height="28" rx="5"/><rect x="466" y="310" width="34" height="28" rx="5"/><rect x="508" y="310" width="34" height="28" rx="5"/></g><text x="431" y="356" class="small" text-anchor="middle">Block → Warp → SM</text>
  </g>
  <g>
    <rect x="564" y="196" width="226" height="174" rx="14" fill="#edf6ff" stroke="#3d82bd" stroke-width="2"/>
    <text x="677" y="226" class="heading" text-anchor="middle">GPC 2</text><text x="677" y="250" class="small" text-anchor="middle">完整设计：10 SM</text>
    <g fill="#d6eaff" stroke="#5793c7"><rect x="586" y="272" width="34" height="28" rx="5"/><rect x="628" y="272" width="34" height="28" rx="5"/><rect x="670" y="272" width="34" height="28" rx="5"/><rect x="712" y="272" width="34" height="28" rx="5"/><rect x="754" y="272" width="34" height="28" rx="5"/><rect x="586" y="310" width="34" height="28" rx="5"/><rect x="628" y="310" width="34" height="28" rx="5"/><rect x="670" y="310" width="34" height="28" rx="5"/><rect x="712" y="310" width="34" height="28" rx="5"/><rect x="754" y="310" width="34" height="28" rx="5"/></g><text x="677" y="356" class="small" text-anchor="middle">Block → Warp → SM</text>
  </g>
  <g>
    <rect x="810" y="196" width="226" height="174" rx="14" fill="#edf6ff" stroke="#3d82bd" stroke-width="2"/>
    <text x="923" y="226" class="heading" text-anchor="middle">GPC 3</text><text x="923" y="250" class="small" text-anchor="middle">完整设计：10 SM</text>
    <g fill="#d6eaff" stroke="#5793c7"><rect x="832" y="272" width="34" height="28" rx="5"/><rect x="874" y="272" width="34" height="28" rx="5"/><rect x="916" y="272" width="34" height="28" rx="5"/><rect x="958" y="272" width="34" height="28" rx="5"/><rect x="1000" y="272" width="34" height="28" rx="5"/><rect x="832" y="310" width="34" height="28" rx="5"/><rect x="874" y="310" width="34" height="28" rx="5"/><rect x="916" y="310" width="34" height="28" rx="5"/><rect x="958" y="310" width="34" height="28" rx="5"/><rect x="1000" y="310" width="34" height="28" rx="5"/></g><text x="923" y="356" class="small" text-anchor="middle">Block → Warp → SM</text>
  </g>
  <g>
    <rect x="1056" y="196" width="226" height="174" rx="14" fill="#edf6ff" stroke="#3d82bd" stroke-width="2"/>
    <text x="1169" y="226" class="heading" text-anchor="middle">GPC 4</text><text x="1169" y="250" class="small" text-anchor="middle">完整设计：10 SM</text>
    <g fill="#d6eaff" stroke="#5793c7"><rect x="1078" y="272" width="34" height="28" rx="5"/><rect x="1120" y="272" width="34" height="28" rx="5"/><rect x="1162" y="272" width="34" height="28" rx="5"/><rect x="1204" y="272" width="34" height="28" rx="5"/><rect x="1246" y="272" width="34" height="28" rx="5"/><rect x="1078" y="310" width="34" height="28" rx="5"/><rect x="1120" y="310" width="34" height="28" rx="5"/><rect x="1162" y="310" width="34" height="28" rx="5"/><rect x="1204" y="310" width="34" height="28" rx="5"/><rect x="1246" y="310" width="34" height="28" rx="5"/></g><text x="1169" y="356" class="small" text-anchor="middle">Block → Warp → SM</text>
  </g>
  <g>
    <rect x="1302" y="196" width="226" height="174" rx="14" fill="#edf6ff" stroke="#3d82bd" stroke-width="2"/>
    <text x="1415" y="226" class="heading" text-anchor="middle">GPC 5</text><text x="1415" y="250" class="small" text-anchor="middle">完整设计：10 SM</text>
    <g fill="#d6eaff" stroke="#5793c7"><rect x="1324" y="272" width="34" height="28" rx="5"/><rect x="1366" y="272" width="34" height="28" rx="5"/><rect x="1408" y="272" width="34" height="28" rx="5"/><rect x="1450" y="272" width="34" height="28" rx="5"/><rect x="1492" y="272" width="34" height="28" rx="5"/><rect x="1324" y="310" width="34" height="28" rx="5"/><rect x="1366" y="310" width="34" height="28" rx="5"/><rect x="1408" y="310" width="34" height="28" rx="5"/><rect x="1450" y="310" width="34" height="28" rx="5"/><rect x="1492" y="310" width="34" height="28" rx="5"/></g><text x="1415" y="356" class="small" text-anchor="middle">Block → Warp → SM</text>
  </g>

  <rect x="290" y="404" width="1020" height="62" rx="12" fill="#e8eef5" stroke="#59758e" stroke-width="2"/>
  <text x="800" y="432" class="heading" text-anchor="middle">全芯片互连 / Work Distributor</text>
  <text x="800" y="455" class="small" text-anchor="middle">把工作分发到 GPC/SM，并连接 Cache、显存分区与 I/O</text>

  <rect x="62" y="407" width="196" height="56" rx="12" fill="#eaf4ff" stroke="#3278b5" stroke-width="2"/>
  <text x="160" y="432" class="heading" text-anchor="middle">PCIe 3.0 x16</text><text x="160" y="454" class="small" text-anchor="middle">主机、控制与数据</text>
  <line x1="258" y1="435" x2="280" y2="435" stroke="#235b91" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1342" y="395" width="196" height="80" rx="12" fill="#fdecef" stroke="#bb475d" stroke-width="2"/>
  <text x="1440" y="425" class="heading" text-anchor="middle">NVLink 1.0</text><text x="1440" y="449" class="body" text-anchor="middle">4 条点对点 Link</text><text x="1440" y="468" class="small" text-anchor="middle">GPU ↔ GPU/支持的 CPU</text>
  <line x1="1310" y1="435" x2="1332" y2="435" stroke="#bb475d" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="230" y="500" width="1140" height="70" rx="14" fill="#f1edfb" stroke="#7356ae" stroke-width="2"/>
  <text x="800" y="531" class="heading" text-anchor="middle">共享 L2 Cache：4 MB</text>
  <text x="800" y="557" class="small" text-anchor="middle">承接所有 SM、显存分区和 Peer/I/O 路径的数据访问</text>
  <line x1="800" y1="466" x2="800" y2="491" stroke="#235b91" stroke-width="3" marker-end="url(#arrow)"/>

  <g fill="#fff7e4" stroke="#cf8a19" stroke-width="2">
    <rect x="92" y="638" width="156" height="58" rx="10"/><rect x="272" y="638" width="156" height="58" rx="10"/><rect x="452" y="638" width="156" height="58" rx="10"/><rect x="632" y="638" width="156" height="58" rx="10"/><rect x="812" y="638" width="156" height="58" rx="10"/><rect x="992" y="638" width="156" height="58" rx="10"/><rect x="1172" y="638" width="156" height="58" rx="10"/><rect x="1352" y="638" width="156" height="58" rx="10"/>
  </g>
  <g class="micro" text-anchor="middle"><text x="170" y="674">MC 0</text><text x="350" y="674">MC 1</text><text x="530" y="674">MC 2</text><text x="710" y="674">MC 3</text><text x="890" y="674">MC 4</text><text x="1070" y="674">MC 5</text><text x="1250" y="674">MC 6</text><text x="1430" y="674">MC 7</text></g>
  <g stroke="#cf8a19" stroke-width="2"><line x1="170" y1="570" x2="170" y2="630"/><line x1="350" y1="570" x2="350" y2="630"/><line x1="530" y1="570" x2="530" y2="630"/><line x1="710" y1="570" x2="710" y2="630"/><line x1="890" y1="570" x2="890" y2="630"/><line x1="1070" y1="570" x2="1070" y2="630"/><line x1="1250" y1="570" x2="1250" y2="630"/><line x1="1430" y1="570" x2="1430" y2="630"/></g>
  <rect x="58" y="583" width="1484" height="52" fill="#fff"/>
  <text x="72" y="616" class="section">② 显存接口：8 个 Memory Controller 分区连接 4 组 HBM2</text>

  <g>
    <rect x="112" y="748" width="310" height="94" rx="14" fill="#eaf8f2" stroke="#338b65" stroke-width="2"/><text x="267" y="783" class="heading" text-anchor="middle">HBM2 Stack 0</text><text x="267" y="810" class="body" text-anchor="middle">4 GB · 1024-bit</text><text x="267" y="832" class="small" text-anchor="middle">4-Die Stack</text>
    <rect x="467" y="748" width="310" height="94" rx="14" fill="#eaf8f2" stroke="#338b65" stroke-width="2"/><text x="622" y="783" class="heading" text-anchor="middle">HBM2 Stack 1</text><text x="622" y="810" class="body" text-anchor="middle">4 GB · 1024-bit</text><text x="622" y="832" class="small" text-anchor="middle">4-Die Stack</text>
    <rect x="822" y="748" width="310" height="94" rx="14" fill="#eaf8f2" stroke="#338b65" stroke-width="2"/><text x="977" y="783" class="heading" text-anchor="middle">HBM2 Stack 2</text><text x="977" y="810" class="body" text-anchor="middle">4 GB · 1024-bit</text><text x="977" y="832" class="small" text-anchor="middle">4-Die Stack</text>
    <rect x="1177" y="748" width="310" height="94" rx="14" fill="#eaf8f2" stroke="#338b65" stroke-width="2"/><text x="1332" y="783" class="heading" text-anchor="middle">HBM2 Stack 3</text><text x="1332" y="810" class="body" text-anchor="middle">4 GB · 1024-bit</text><text x="1332" y="832" class="small" text-anchor="middle">4-Die Stack</text>
  </g>
  <g stroke="#338b65" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M170 696V720H267V740"/><path d="M350 696V720H267V740"/><path d="M530 696V720H622V740"/><path d="M710 696V720H622V740"/><path d="M890 696V720H977V740"/><path d="M1070 696V720H977V740"/><path d="M1250 696V720H1332V740"/><path d="M1430 696V720H1332V740"/></g>

  <rect x="112" y="868" width="1375" height="36" rx="10" fill="#fff7dc" stroke="#d1a022" stroke-width="2"/>
  <text x="800" y="892" class="body" text-anchor="middle">合计：16 GB HBM2 · 4096-bit 总位宽 · 约 732 GB/s 理论峰值带宽</text>
</svg>
