<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">GP100 SM 内部架构</title>
  <desc id="desc">展示 Block 和 Warp 进入一个 GP100 SM 后，经过两个处理分区中的 Warp Scheduler、Dispatch、Register File、FP32、FP64、LD/ST、SFU，以及 Shared Memory、L1 Texture Cache 和 L2 HBM2 的关系。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dce6ef" stroke-width="1" opacity=".7"/></pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18324d" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 1L10 5 0 9Z" fill="#235b91"/></marker>
    <style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#132f4c}.title{font-size:34px;font-weight:700;fill:#fff}.subtitle{font-size:18px;fill:#c9d8e8}.section{font-size:23px;font-weight:700}.heading{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#55708a}.micro{font-size:13px;font-weight:700}</style>
  </defs>
  <rect width="1600" height="960" fill="#f8fbfd"/><rect y="100" width="1600" height="860" fill="url(#grid)"/>
  <rect width="1600" height="100" fill="#102b49"/><text x="48" y="47" class="title">一个 GP100 SM：Warp 怎样进入执行管线</text><text x="48" y="77" class="subtitle">两个独立处理分区 · 64 FP32 Core · 32 FP64 Unit · 无 Tensor Core</text>

  <!-- Software hierarchy -->
  <text x="48" y="143" class="section">① 软件任务如何到达 SM</text>
  <g>
    <rect x="60" y="166" width="245" height="76" rx="12" fill="#edf6ff" stroke="#3d82bd" stroke-width="2"/><text x="182" y="197" class="heading" text-anchor="middle">Grid</text><text x="182" y="224" class="small" text-anchor="middle">一次 Kernel 启动</text>
    <rect x="365" y="166" width="245" height="76" rx="12" fill="#fdecf0" stroke="#bb4c61" stroke-width="2"/><text x="487" y="197" class="heading" text-anchor="middle">Thread Block</text><text x="487" y="224" class="small" text-anchor="middle">整体驻留一个 SM</text>
    <rect x="670" y="166" width="245" height="76" rx="12" fill="#fff5d7" stroke="#c99118" stroke-width="2"/><text x="792" y="197" class="heading" text-anchor="middle">Warp</text><text x="792" y="224" class="small" text-anchor="middle">32 个 Thread</text>
    <rect x="975" y="166" width="565" height="76" rx="12" fill="#eaf8f2" stroke="#338b65" stroke-width="2"/><text x="1257" y="197" class="heading" text-anchor="middle">SM 驻留资源</text><text x="1257" y="224" class="small" text-anchor="middle">多个 Block/Warp 共享 Register File、Shared Memory 和执行管线</text>
    <g stroke="#235b91" stroke-width="3" marker-end="url(#arrow)"><line x1="305" y1="204" x2="355" y2="204"/><line x1="610" y1="204" x2="660" y2="204"/><line x1="915" y1="204" x2="965" y2="204"/></g>
  </g>

  <!-- SM outer -->
  <rect x="48" y="278" width="1504" height="618" rx="20" fill="#fff" stroke="#54728d" stroke-width="2" filter="url(#shadow)"/>
  <text x="78" y="317" class="section">② 一个 SM 的内部逻辑</text><text x="1512" y="316" class="small" text-anchor="end">调度器选择“就绪 Warp”，并不把 Thread 永久绑定到某个 Core</text>
  <rect x="204" y="339" width="1192" height="58" rx="12" fill="#e8eef5" stroke="#607b93" stroke-width="2"/><text x="800" y="375" class="heading" text-anchor="middle">Instruction Cache / 指令前端</text>

  <!-- Partitions -->
  <rect x="82" y="425" width="698" height="330" rx="16" fill="#edf6ff" stroke="#3d82bd" stroke-width="2"/>
  <text x="112" y="459" class="heading">Processing Block 0（处理分区 0）</text>
  <rect x="112" y="482" width="256" height="58" rx="10" fill="#fff" stroke="#4f8fc5" stroke-width="2"/><text x="240" y="507" class="heading" text-anchor="middle">Warp Scheduler 0</text><text x="240" y="528" class="small" text-anchor="middle">选择就绪 Warp</text>
  <rect x="398" y="482" width="352" height="58" rx="10" fill="#fff" stroke="#4f8fc5" stroke-width="2"/><text x="574" y="507" class="heading" text-anchor="middle">2 × Dispatch Unit</text><text x="574" y="528" class="small" text-anchor="middle">向可用管线发射指令</text>
  <rect x="112" y="565" width="638" height="54" rx="10" fill="#f0edfb" stroke="#7356ae" stroke-width="2"/><text x="431" y="598" class="heading" text-anchor="middle">Register File Partition（寄存器文件分区）</text>
  <g>
    <rect x="112" y="642" width="140" height="82" rx="10" fill="#fff" stroke="#be5365" stroke-width="2"/><text x="182" y="675" class="heading" text-anchor="middle">32 × FP32</text><text x="182" y="703" class="small" text-anchor="middle">含 packed FP16</text>
    <rect x="278" y="642" width="140" height="82" rx="10" fill="#fff" stroke="#cf8a19" stroke-width="2"/><text x="348" y="675" class="heading" text-anchor="middle">16 × FP64</text><text x="348" y="703" class="small" text-anchor="middle">双精度管线</text>
    <rect x="444" y="642" width="140" height="82" rx="10" fill="#fff" stroke="#338b65" stroke-width="2"/><text x="514" y="675" class="heading" text-anchor="middle">8 × LD/ST</text><text x="514" y="703" class="small" text-anchor="middle">加载与存储</text>
    <rect x="610" y="642" width="140" height="82" rx="10" fill="#fff" stroke="#3d82bd" stroke-width="2"/><text x="680" y="675" class="heading" text-anchor="middle">8 × SFU</text><text x="680" y="703" class="small" text-anchor="middle">特殊函数</text>
  </g>

  <rect x="820" y="425" width="698" height="330" rx="16" fill="#effaf4" stroke="#338b65" stroke-width="2"/>
  <text x="850" y="459" class="heading">Processing Block 1（处理分区 1）</text>
  <rect x="850" y="482" width="256" height="58" rx="10" fill="#fff" stroke="#54a37d" stroke-width="2"/><text x="978" y="507" class="heading" text-anchor="middle">Warp Scheduler 1</text><text x="978" y="528" class="small" text-anchor="middle">选择就绪 Warp</text>
  <rect x="1136" y="482" width="352" height="58" rx="10" fill="#fff" stroke="#54a37d" stroke-width="2"/><text x="1312" y="507" class="heading" text-anchor="middle">2 × Dispatch Unit</text><text x="1312" y="528" class="small" text-anchor="middle">向可用管线发射指令</text>
  <rect x="850" y="565" width="638" height="54" rx="10" fill="#f0edfb" stroke="#7356ae" stroke-width="2"/><text x="1169" y="598" class="heading" text-anchor="middle">Register File Partition（寄存器文件分区）</text>
  <g>
    <rect x="850" y="642" width="140" height="82" rx="10" fill="#fff" stroke="#be5365" stroke-width="2"/><text x="920" y="675" class="heading" text-anchor="middle">32 × FP32</text><text x="920" y="703" class="small" text-anchor="middle">含 packed FP16</text>
    <rect x="1016" y="642" width="140" height="82" rx="10" fill="#fff" stroke="#cf8a19" stroke-width="2"/><text x="1086" y="675" class="heading" text-anchor="middle">16 × FP64</text><text x="1086" y="703" class="small" text-anchor="middle">双精度管线</text>
    <rect x="1182" y="642" width="140" height="82" rx="10" fill="#fff" stroke="#338b65" stroke-width="2"/><text x="1252" y="675" class="heading" text-anchor="middle">8 × LD/ST</text><text x="1252" y="703" class="small" text-anchor="middle">加载与存储</text>
    <rect x="1348" y="642" width="140" height="82" rx="10" fill="#fff" stroke="#3d82bd" stroke-width="2"/><text x="1418" y="675" class="heading" text-anchor="middle">8 × SFU</text><text x="1418" y="703" class="small" text-anchor="middle">特殊函数</text>
  </g>

  <g stroke="#235b91" stroke-width="2.5" marker-end="url(#arrow)"><line x1="240" y1="540" x2="398" y2="540"/><line x1="978" y1="540" x2="1136" y2="540"/><line x1="431" y1="619" x2="431" y2="634"/><line x1="1169" y1="619" x2="1169" y2="634"/></g>

  <rect x="204" y="780" width="560" height="75" rx="12" fill="#fff5d8" stroke="#c99118" stroke-width="2"/><text x="484" y="811" class="heading" text-anchor="middle">64 KB Shared Memory</text><text x="484" y="838" class="small" text-anchor="middle">由 Block 显式分配，线程协作与数据复用</text>
  <rect x="836" y="780" width="560" height="75" rx="12" fill="#eaf8f2" stroke="#338b65" stroke-width="2"/><text x="1116" y="811" class="heading" text-anchor="middle">L1 / Texture Cache</text><text x="1116" y="838" class="small" text-anchor="middle">承接部分 Load/Store 与纹理访问</text>
  <line x1="800" y1="855" x2="800" y2="878" stroke="#235b91" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="490" y="876" width="620" height="48" rx="11" fill="#e8eef5" stroke="#607b93" stroke-width="2"/><text x="800" y="907" class="heading" text-anchor="middle">共享 L2 Cache → HBM2</text>
</svg>
