<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">传统 PCI 插槽与 PCI9052 芯片的并行信号连接</title><desc id="desc">按功能分组展示传统 PCI 的地址数据、命令、握手、仲裁、中断和错误信号，并对比芯片本地总线接口。</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102740" flood-opacity=".13"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#2b5f94"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:24px;font-weight:700}.s{font-size:17px;fill:#49647e}.chip{stroke-width:2.5;rx:14;filter:url(#shadow)}.sig{stroke:#2b5f94;stroke-width:3;fill:none;marker-end:url(#a)}.bi{stroke:#2c8c5e;stroke-width:3;fill:none;marker-start:url(#a);marker-end:url(#a)}.lab{font-size:16px;font-weight:700}</style></defs>
  <rect width="1200" height="760" fill="#f8fbfd"/><rect y="82" width="1200" height="678" fill="url(#grid)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">传统 PCI：多组并行信号共同完成一次事务</text>
  <rect class="chip" x="55" y="135" width="245" height="510" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="177" y="180" text-anchor="middle">PCI 插槽</text><text class="s" x="177" y="212" text-anchor="middle">共享并行总线</text>
  <rect class="chip" x="445" y="135" width="310" height="510" fill="#e9f7ef" stroke="#2c8c5e"/><text class="t" x="600" y="180" text-anchor="middle">PCI9052 桥接芯片</text><text class="s" x="600" y="212" text-anchor="middle">PCI 协议 ↔ 本地总线</text>
  <rect class="chip" x="900" y="135" width="245" height="510" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="1022" y="180" text-anchor="middle">本地设备逻辑</text><text class="s" x="1022" y="212" text-anchor="middle">寄存器 / SRAM / FPGA</text>
  <path class="bi" d="M300 270H445"/><text class="lab" x="372" y="255" text-anchor="middle">AD[31:0]</text><text class="s" x="372" y="290" text-anchor="middle">地址/数据复用</text>
  <path class="bi" d="M300 350H445"/><text class="lab" x="372" y="335" text-anchor="middle">C/BE#[3:0]</text><text class="s" x="372" y="370" text-anchor="middle">命令/字节使能</text>
  <path class="bi" d="M300 430H445"/><text class="lab" x="372" y="415" text-anchor="middle">FRAME# · IRDY#</text><text class="s" x="372" y="450" text-anchor="middle">事务与发起方握手</text>
  <path class="bi" d="M300 510H445"/><text class="lab" x="372" y="495" text-anchor="middle">TRDY# · DEVSEL# · STOP#</text><text class="s" x="372" y="530" text-anchor="middle">目标方握手</text>
  <path class="sig" d="M300 585H445"/><text class="lab" x="372" y="570" text-anchor="middle">CLK · RST# · REQ#/GNT#</text><text class="s" x="372" y="606" text-anchor="middle">时钟、复位与仲裁</text>
  <path class="bi" d="M755 285H900"/><text class="lab" x="827" y="270" text-anchor="middle">LAD[31:0]</text><text class="s" x="827" y="305" text-anchor="middle">本地地址/数据</text>
  <path class="bi" d="M755 380H900"/><text class="lab" x="827" y="365" text-anchor="middle">LBE#[3:0]</text><text class="s" x="827" y="400" text-anchor="middle">本地字节使能</text>
  <path class="bi" d="M755 475H900"/><text class="lab" x="827" y="460" text-anchor="middle">ADS# · READY# · BLAST#</text><text class="s" x="827" y="495" text-anchor="middle">本地事务握手</text>
  <path class="bi" d="M755 570H900"/><text class="lab" x="827" y="555" text-anchor="middle">LINT# · GPIO</text><text class="s" x="827" y="590" text-anchor="middle">中断与控制</text>
  <rect x="70" y="675" width="1060" height="55" rx="12" fill="#fcebec" stroke="#ca3d4b" stroke-width="2"/><text class="s" x="600" y="709" text-anchor="middle">关键区别：传统 PCI 依赖共享时钟和多根并行信号；PCIe 把数据编码后通过高速串行 Lane 传输</text>
</svg>
