<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">PCIe 分层通信模型</title><desc id="desc">两个 PCIe 设备的事务层、数据链路层和物理层逐层通信，最底部通过物理 Link 连接。</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102740" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2b5f94"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10 0L0 5l10 5z" fill="#2b5f94"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:23px;font-weight:700}.s{font-size:17px;fill:#49647e}.box{stroke-width:2.5;rx:14;filter:url(#shadow)}.v{stroke:#607b94;stroke-width:3;fill:none;marker-end:url(#a)}.peer{stroke:#2b5f94;stroke-width:4;fill:none;marker-start:url(#ar);marker-end:url(#a);stroke-dasharray:10 7}.lab{font-size:17px;font-weight:700;fill:#2b5f94}</style></defs>
  <rect width="1200" height="790" fill="#f8fbfd"/><rect y="82" width="1200" height="708" fill="url(#grid)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">PCIe 三层模型：逐层封装、对端逐层解析</text>
  <text class="t" x="270" y="127" text-anchor="middle">Device A（发送侧）</text><text class="t" x="930" y="127" text-anchor="middle">Device B（接收侧）</text>
  <rect class="box" x="120" y="154" width="300" height="76" fill="#f7efff" stroke="#8153b7"/><text class="t" x="270" y="188" text-anchor="middle">Device Core</text><text class="s" x="270" y="215" text-anchor="middle">驱动可见的功能逻辑</text>
  <rect class="box" x="780" y="154" width="300" height="76" fill="#f7efff" stroke="#8153b7"/><text class="t" x="930" y="188" text-anchor="middle">Device Core</text><text class="s" x="930" y="215" text-anchor="middle">消费请求或返回完成</text>
  <rect class="box" x="120" y="278" width="300" height="92" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="270" y="315" text-anchor="middle">事务层 Transaction</text><text class="s" x="270" y="346" text-anchor="middle">构造/解析 TLP · 地址路由</text>
  <rect class="box" x="780" y="278" width="300" height="92" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="930" y="315" text-anchor="middle">事务层 Transaction</text><text class="s" x="930" y="346" text-anchor="middle">解析/构造 TLP · 完成事务</text>
  <rect class="box" x="120" y="418" width="300" height="92" fill="#e9f7ef" stroke="#2c8c5e"/><text class="t" x="270" y="455" text-anchor="middle">数据链路层 Data Link</text><text class="s" x="270" y="486" text-anchor="middle">序号 · LCRC · ACK/NAK · 重放</text>
  <rect class="box" x="780" y="418" width="300" height="92" fill="#e9f7ef" stroke="#2c8c5e"/><text class="t" x="930" y="455" text-anchor="middle">数据链路层 Data Link</text><text class="s" x="930" y="486" text-anchor="middle">校验 · 确认 · 必要时要求重传</text>
  <rect class="box" x="120" y="558" width="300" height="92" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="270" y="595" text-anchor="middle">物理层 Physical</text><text class="s" x="270" y="626" text-anchor="middle">编码 · SerDes · Lane · 链路训练</text>
  <rect class="box" x="780" y="558" width="300" height="92" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="930" y="595" text-anchor="middle">物理层 Physical</text><text class="s" x="930" y="626" text-anchor="middle">时钟恢复 · 解码 · 解串</text>
  <path class="v" d="M270 230V278"/><path class="v" d="M270 370V418"/><path class="v" d="M270 510V558"/><path class="v" d="M930 650V698" opacity="0"/>
  <path class="v" d="M930 558V510"/><path class="v" d="M930 418V370"/><path class="v" d="M930 278V230"/>
  <path class="peer" d="M420 324H780"/><text class="lab" x="600" y="307" text-anchor="middle">TLP 的逻辑对等通信</text>
  <path class="peer" d="M420 464H780"/><text class="lab" x="600" y="447" text-anchor="middle">可靠链路语义</text>
  <path class="peer" d="M420 604H780"/><text class="lab" x="600" y="587" text-anchor="middle">实际电气 Link</text>
  <rect x="120" y="700" width="960" height="54" rx="12" fill="#fcebec" stroke="#ca3d4b" stroke-width="2"/><text class="s" x="600" y="733" text-anchor="middle">注意：层间箭头表示职责和封装关系，不代表数据绕过同一设备内的其他层</text>
</svg>
