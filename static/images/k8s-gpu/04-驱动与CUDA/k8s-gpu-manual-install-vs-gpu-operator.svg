<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes GPU 软件栈：手动管理与 GPU Operator</title>
  <desc id="desc">上半部分比较手动管理和 GPU Operator 的生命周期管理方式，中间说明组件最终落在 GPU 节点，下半部分展示两种方式共同的运行时数据路径。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#dce6ef" stroke-width="1" opacity="0.7"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M0,1 L10,5 L0,9 z" fill="#2563a7"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M0,1 L10,5 L0,9 z" fill="#21865b"/>
    </marker>
    <marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M0,1 L10,5 L0,9 z" fill="#173b63"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #132f4c; }
      .title { font-size: 34px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 18px; fill: #c9d8e8; }
      .section-title { font-size: 23px; font-weight: 700; }
      .card-title { font-size: 24px; font-weight: 700; }
      .node-title { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #55708a; }
      .label { font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f8fbfd"/>
  <rect y="104" width="1600" height="936" fill="url(#grid)"/>

  <rect width="1600" height="104" fill="#102b49"/>
  <text x="48" y="49" class="title">Kubernetes GPU 软件栈：手动管理与 GPU Operator</text>
  <text x="48" y="79" class="subtitle">差异在生命周期管理；Pod 使用 GPU 的运行时数据路径相同</text>

  <text x="48" y="142" class="section-title">① 管理面：谁负责安装、升级、回滚和状态修复</text>

  <!-- Manual management -->
  <rect x="48" y="166" width="710" height="336" rx="18" fill="#eef6ff" stroke="#4282bd" stroke-width="2" filter="url(#shadow)"/>
  <rect x="48" y="166" width="710" height="58" rx="18" fill="#dbeeff"/>
  <rect x="48" y="205" width="710" height="19" fill="#dbeeff"/>
  <text x="76" y="203" class="card-title" fill="#174f82">A　手动管理</text>
  <text x="702" y="202" class="small" text-anchor="end">由运维体系维护版本和变更窗口</text>

  <rect x="105" y="251" width="596" height="72" rx="12" fill="#ffffff" stroke="#4282bd" stroke-width="2"/>
  <text x="403" y="281" class="node-title" text-anchor="middle">管理员 / Ansible / 系统镜像</text>
  <text x="403" y="306" class="small" text-anchor="middle">软件仓库、节点初始化脚本、版本清单</text>

  <line x1="403" y1="323" x2="403" y2="351" stroke="#2563a7" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="403" y1="343" x2="233" y2="343" stroke="#2563a7" stroke-width="3"/>
  <line x1="233" y1="343" x2="233" y2="365" stroke="#2563a7" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="403" y1="343" x2="573" y2="343" stroke="#2563a7" stroke-width="3"/>
  <line x1="573" y1="343" x2="573" y2="365" stroke="#2563a7" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="92" y="371" width="282" height="96" rx="12" fill="#ffffff" stroke="#75a8d5" stroke-width="2"/>
  <text x="233" y="405" class="node-title" text-anchor="middle">宿主机软件</text>
  <text x="233" y="432" class="body" text-anchor="middle">NVIDIA Driver</text>
  <text x="233" y="455" class="small" text-anchor="middle">Container Toolkit / CDI</text>

  <rect x="432" y="371" width="282" height="96" rx="12" fill="#ffffff" stroke="#75a8d5" stroke-width="2"/>
  <text x="573" y="405" class="node-title" text-anchor="middle">Kubernetes 组件</text>
  <text x="573" y="432" class="body" text-anchor="middle">Device Plugin</text>
  <text x="573" y="455" class="small" text-anchor="middle">GFD / DCGM Exporter</text>

  <!-- Operator management -->
  <rect x="842" y="166" width="710" height="336" rx="18" fill="#effaf4" stroke="#319168" stroke-width="2" filter="url(#shadow)"/>
  <rect x="842" y="166" width="710" height="58" rx="18" fill="#dff4e9"/>
  <rect x="842" y="205" width="710" height="19" fill="#dff4e9"/>
  <text x="870" y="203" class="card-title" fill="#176640">B　GPU Operator 管理</text>
  <text x="1496" y="202" class="small" text-anchor="end">由 ClusterPolicy 声明期望状态</text>

  <rect x="886" y="253" width="182" height="68" rx="12" fill="#ffffff" stroke="#319168" stroke-width="2"/>
  <text x="977" y="281" class="node-title" text-anchor="middle">ClusterPolicy</text>
  <text x="977" y="305" class="small" text-anchor="middle">期望配置</text>
  <line x1="1068" y1="287" x2="1118" y2="287" stroke="#21865b" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="1123" y="253" width="382" height="68" rx="12" fill="#ffffff" stroke="#319168" stroke-width="2"/>
  <text x="1314" y="281" class="node-title" text-anchor="middle">GPU Operator Controller</text>
  <text x="1314" y="305" class="small" text-anchor="middle">观察节点状态并持续协调</text>

  <line x1="1314" y1="321" x2="1314" y2="344" stroke="#21865b" stroke-width="3"/>
  <line x1="978" y1="344" x2="1426" y2="344" stroke="#21865b" stroke-width="3"/>
  <line x1="978" y1="344" x2="978" y2="367" stroke="#21865b" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1202" y1="344" x2="1202" y2="367" stroke="#21865b" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1426" y1="344" x2="1426" y2="367" stroke="#21865b" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="872" y="373" width="212" height="94" rx="12" fill="#ffffff" stroke="#71b994" stroke-width="2"/>
  <text x="978" y="407" class="node-title" text-anchor="middle">Driver DaemonSet</text>
  <text x="978" y="434" class="small" text-anchor="middle">准备驱动文件</text>
  <text x="978" y="455" class="small" text-anchor="middle">加载宿主机内核模块</text>

  <rect x="1096" y="373" width="212" height="94" rx="12" fill="#ffffff" stroke="#71b994" stroke-width="2"/>
  <text x="1202" y="407" class="node-title" text-anchor="middle">Toolkit DaemonSet</text>
  <text x="1202" y="434" class="small" text-anchor="middle">配置 containerd / CRI-O</text>
  <text x="1202" y="455" class="small" text-anchor="middle">准备 CDI 设备描述</text>

  <rect x="1320" y="373" width="212" height="94" rx="12" fill="#ffffff" stroke="#71b994" stroke-width="2"/>
  <text x="1426" y="407" class="node-title" text-anchor="middle">附加 DaemonSet</text>
  <text x="1426" y="434" class="small" text-anchor="middle">Device Plugin / GFD</text>
  <text x="1426" y="455" class="small" text-anchor="middle">DCGM Exporter</text>

  <!-- Management arrows -->
  <line x1="403" y1="502" x2="403" y2="542" stroke="#2563a7" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
  <rect x="285" y="510" width="104" height="25" rx="12" fill="#f8fbfd"/>
  <text x="337" y="528" class="label" text-anchor="middle" fill="#2563a7">直接安装</text>

  <line x1="1197" y1="502" x2="1197" y2="542" stroke="#21865b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/>
  <rect x="1210" y="510" width="126" height="25" rx="12" fill="#f8fbfd"/>
  <text x="1273" y="528" class="label" text-anchor="middle" fill="#21865b">持续协调</text>

  <!-- Node landing area -->
  <rect x="48" y="548" width="1504" height="164" rx="18" fill="#ffffff" stroke="#94aabd" stroke-width="2"/>
  <text x="76" y="584" class="section-title">② GPU 节点：最终组件落点</text>
  <text x="1504" y="582" class="small" text-anchor="end">Operator 改变维护方式，不改变硬件访问边界</text>

  <rect x="78" y="608" width="280" height="79" rx="12" fill="#fff4dd" stroke="#c9861a" stroke-width="2"/>
  <text x="218" y="639" class="node-title" text-anchor="middle">宿主机 NVIDIA 驱动</text>
  <text x="218" y="666" class="small" text-anchor="middle">内核模块 + 用户态驱动库</text>

  <rect x="381" y="608" width="300" height="79" rx="12" fill="#eaf4ff" stroke="#3c80bc" stroke-width="2"/>
  <text x="531" y="639" class="node-title" text-anchor="middle">containerd / CRI-O</text>
  <text x="531" y="666" class="small" text-anchor="middle">Container Toolkit / CDI</text>

  <rect x="704" y="608" width="280" height="79" rx="12" fill="#edf8f3" stroke="#338b65" stroke-width="2"/>
  <text x="844" y="639" class="node-title" text-anchor="middle">Device Plugin / GFD</text>
  <text x="844" y="666" class="small" text-anchor="middle">注册资源与节点能力标签</text>

  <rect x="1007" y="608" width="250" height="79" rx="12" fill="#f3effd" stroke="#7256ae" stroke-width="2"/>
  <text x="1132" y="639" class="node-title" text-anchor="middle">DCGM Exporter</text>
  <text x="1132" y="666" class="small" text-anchor="middle">读取并导出 GPU 指标</text>

  <rect x="1280" y="608" width="242" height="79" rx="12" fill="#fdecef" stroke="#be5365" stroke-width="2"/>
  <text x="1401" y="639" class="node-title" text-anchor="middle">物理 GPU</text>
  <text x="1401" y="666" class="small" text-anchor="middle">计算单元、显存与互联</text>

  <!-- Runtime data path -->
  <rect x="48" y="742" width="1504" height="206" rx="18" fill="#f6f9fc" stroke="#365c7d" stroke-width="2"/>
  <text x="76" y="780" class="section-title">③ 运行时数据路径：两种部署方式相同</text>

  <rect x="76" y="817" width="190" height="87" rx="12" fill="#ffffff" stroke="#52718d" stroke-width="2"/>
  <text x="171" y="850" class="node-title" text-anchor="middle">业务 Pod</text>
  <text x="171" y="878" class="small" text-anchor="middle">申请 nvidia.com/gpu</text>

  <rect x="305" y="817" width="190" height="87" rx="12" fill="#ffffff" stroke="#52718d" stroke-width="2"/>
  <text x="400" y="850" class="node-title" text-anchor="middle">Scheduler</text>
  <text x="400" y="878" class="small" text-anchor="middle">选择可用 GPU 节点</text>

  <rect x="534" y="817" width="210" height="87" rx="12" fill="#ffffff" stroke="#52718d" stroke-width="2"/>
  <text x="639" y="850" class="node-title" text-anchor="middle">Kubelet</text>
  <text x="639" y="878" class="small" text-anchor="middle">调用 Device Plugin Allocate</text>

  <rect x="783" y="817" width="220" height="87" rx="12" fill="#ffffff" stroke="#52718d" stroke-width="2"/>
  <text x="893" y="850" class="node-title" text-anchor="middle">容器运行时</text>
  <text x="893" y="878" class="small" text-anchor="middle">注入设备节点与驱动库</text>

  <rect x="1042" y="817" width="210" height="87" rx="12" fill="#ffffff" stroke="#52718d" stroke-width="2"/>
  <text x="1147" y="850" class="node-title" text-anchor="middle">宿主机驱动</text>
  <text x="1147" y="878" class="small" text-anchor="middle">提交命令并管理显存</text>

  <rect x="1291" y="817" width="185" height="87" rx="12" fill="#fdecef" stroke="#be5365" stroke-width="2"/>
  <text x="1383" y="850" class="node-title" text-anchor="middle">GPU 执行</text>
  <text x="1383" y="878" class="small" text-anchor="middle">Kernel / HBM</text>

  <line x1="266" y1="860" x2="297" y2="860" stroke="#173b63" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <line x1="495" y1="860" x2="526" y2="860" stroke="#173b63" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <line x1="744" y1="860" x2="775" y2="860" stroke="#173b63" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <line x1="1003" y1="860" x2="1034" y2="860" stroke="#173b63" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <line x1="1252" y1="860" x2="1283" y2="860" stroke="#173b63" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <!-- Hybrid mode -->
  <rect x="48" y="970" width="1504" height="48" rx="12" fill="#fff8df" stroke="#d2a326" stroke-width="2"/>
  <text x="76" y="1001" class="label" fill="#7a5b00">常见生产组合：</text>
  <text x="226" y="1001" class="body">宿主机预装并维护 NVIDIA 驱动，GPU Operator 负责 Toolkit、Device Plugin、GFD 和 DCGM Exporter。</text>
</svg>
