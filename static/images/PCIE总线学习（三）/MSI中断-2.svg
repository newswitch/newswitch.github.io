<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">PCI Capability 链表</title><desc id="desc">配置空间 34h 的指针指向首个 Capability，每个 Capability 的 Next Pointer 指向下一项，零表示链表结束。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102740" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2b5f94"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:21px;font-weight:700}.m{font-size:16px;fill:#49647e}.box{stroke-width:2.5;rx:13;filter:url(#s)}.line{stroke:#2b5f94;stroke-width:4;fill:none;marker-end:url(#a)}.ptr{font:700 18px Consolas,monospace;fill:#2b5f94}</style></defs>
  <rect width="1200" height="590" fill="#f8fbfd"/><rect y="82" width="1200" height="508" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">Capability 链：34h 指向第一项，Next Pointer 串起后续能力</text>
  <rect class="box" x="50" y="175" width="230" height="190" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="165" y="216" text-anchor="middle">配置空间 Header</text><text class="m" x="165" y="258" text-anchor="middle">Capabilities Pointer</text><text class="ptr" x="165" y="294" text-anchor="middle">Offset 34h = A4h</text><text class="m" x="165" y="333" text-anchor="middle">链表入口</text><path class="line" d="M280 270H350"/>
  <rect class="box" x="350" y="175" width="235" height="190" fill="#e9f7ef" stroke="#2c8c5e"/><text class="t" x="467" y="216" text-anchor="middle">Capability X @ A4h</text><text class="m" x="467" y="252" text-anchor="middle">Capability ID</text><text class="ptr" x="467" y="289" text-anchor="middle">Next = 5Ch</text><text class="m" x="467" y="330" text-anchor="middle">例如 MSI（ID 05h）</text><path class="line" d="M585 270H655"/>
  <rect class="box" x="655" y="175" width="235" height="190" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="772" y="216" text-anchor="middle">Capability Y @ 5Ch</text><text class="m" x="772" y="252" text-anchor="middle">Capability ID</text><text class="ptr" x="772" y="289" text-anchor="middle">Next = E0h</text><text class="m" x="772" y="330" text-anchor="middle">例如 PCI Express</text><path class="line" d="M890 270H960"/>
  <rect class="box" x="960" y="175" width="190" height="190" fill="#fcebec" stroke="#ca3d4b"/><text class="t" x="1055" y="216" text-anchor="middle">Capability Z</text><text class="ptr" x="1055" y="255" text-anchor="middle">@ E0h</text><text class="ptr" x="1055" y="294" text-anchor="middle">Next = 00h</text><text class="m" x="1055" y="333" text-anchor="middle">链表结束</text>
  <rect x="105" y="430" width="990" height="104" rx="14" fill="#f1f4f7" stroke="#718296" stroke-width="2"/><text class="t" x="600" y="468" text-anchor="middle">遍历规则</text><text class="m" x="600" y="499" text-anchor="middle">读取 34h → 跳到当前 Offset → 读取 Capability ID 与 Next Pointer → Next = 00h 时停止</text><text class="m" x="600" y="523" text-anchor="middle">应检测非法偏移、环和越界；不要假设 MSI Capability 一定位于固定地址</text>
</svg>
