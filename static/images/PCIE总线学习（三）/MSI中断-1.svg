<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">MSI Capability 在配置空间中的位置与字段</title><desc id="desc">Status 中的 Capabilities List 位指示能力链存在，34h 指针定位到 MSI Capability，其中包含控制、消息地址和消息数据。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102740" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2b5f94"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:21px;font-weight:700}.m{font-size:16px;fill:#49647e}.box{stroke-width:2.5;rx:13;filter:url(#s)}.line{stroke:#2b5f94;stroke-width:4;fill:none;marker-end:url(#a)}.off{font:700 16px Consolas,monospace;fill:#49647e}.cell{stroke:#fff;stroke-width:3}</style></defs>
  <rect width="1200" height="650" fill="#f8fbfd"/><rect y="82" width="1200" height="568" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">MSI 配置入口：先沿 Capability 链找到 MSI Capability</text>
  <rect class="box" x="60" y="130" width="290" height="400" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="205" y="167" text-anchor="middle">配置空间前 256B</text><rect class="cell" x="90" y="202" width="230" height="62" rx="8" fill="#fff3ca"/><text class="off" x="105" y="239">06h</text><text class="m" x="210" y="229" text-anchor="middle">Status.Bit4 = 1</text><text class="m" x="210" y="251" text-anchor="middle">Capabilities List 有效</text><rect class="cell" x="90" y="292" width="230" height="70" rx="8" fill="#e9f7ef"/><text class="off" x="108" y="326">34h</text><text class="t" x="224" y="326" text-anchor="middle">Cap Pointer</text><text class="m" x="205" y="350" text-anchor="middle">指向 A4h</text><rect class="cell" x="90" y="390" width="230" height="102" rx="8" fill="#f1f4f7"/><text class="m" x="205" y="426" text-anchor="middle">其他 Header / BAR 字段</text><text class="m" x="205" y="454" text-anchor="middle">与 MSI 地址不是一回事</text>
  <path class="line" d="M350 327H455"/><rect class="box" x="455" y="130" width="685" height="430" fill="#fff" stroke="#8153b7"/><text class="t" x="797" y="167" text-anchor="middle">MSI Capability（Capability ID = 05h）</text>
  <g transform="translate(500 205)"><rect class="cell" x="0" y="0" width="190" height="72" rx="8" fill="#f7efff"/><text class="m" x="95" y="30" text-anchor="middle">Capability ID</text><text class="off" x="95" y="55" text-anchor="middle">05h</text><rect class="cell" x="190" y="0" width="190" height="72" rx="8" fill="#f1f4f7"/><text class="m" x="285" y="30" text-anchor="middle">Next Pointer</text><text class="off" x="285" y="55" text-anchor="middle">下一能力偏移</text><rect class="cell" x="380" y="0" width="215" height="72" rx="8" fill="#fff3ca"/><text class="m" x="487" y="30" text-anchor="middle">Message Control</text><text class="m" x="487" y="55" text-anchor="middle">Enable / 64-bit / 向量数</text><rect class="cell" x="0" y="90" width="595" height="72" rx="8" fill="#e7f1fb"/><text class="t" x="297" y="122" text-anchor="middle">Message Address（32-bit 或 64-bit）</text><text class="m" x="297" y="148" text-anchor="middle">中断控制器为设备编程的目标地址</text><rect class="cell" x="0" y="180" width="595" height="72" rx="8" fill="#e9f7ef"/><text class="t" x="297" y="212" text-anchor="middle">Message Data</text><text class="m" x="297" y="238" text-anchor="middle">携带向量等平台相关信息</text><rect class="cell" x="0" y="270" width="595" height="72" rx="8" fill="#fcebec"/><text class="t" x="297" y="302" text-anchor="middle">可选 Mask Bits / Pending Bits</text><text class="m" x="297" y="328" text-anchor="middle">是否存在由 Message Control 指示</text></g>
  <text class="m" x="600" y="610" text-anchor="middle">设备触发 MSI 时发送 Memory Write TLP；Message Address/Data 是“中断消息”，不是普通业务 Buffer</text>
</svg>
