<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">INTx Swizzling 映射表</title><desc id="desc">按设备号模 4 展示 INTA、INTB、INTC、INTD 到上游 PIRQ 的轮转映射。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:20px;font-weight:700}.m{font-size:16px;fill:#49647e}.cell{stroke:#fff;stroke-width:3}.mono{font:700 19px Consolas,monospace}.formula{font:700 23px Consolas,monospace;fill:#2b5f94}</style></defs>
  <rect width="1200" height="670" fill="#f8fbfd"/><rect y="82" width="1200" height="588" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">INTx 轮转规律：由 Device Number 和 Interrupt Pin 共同决定</text>
  <g transform="translate(95 145)"><rect class="cell" x="0" y="0" width="260" height="70" rx="9" fill="#102740"/><text class="t" x="130" y="43" text-anchor="middle" fill="#fff">设备号 D mod 4</text><rect class="cell" x="260" y="0" width="180" height="70" fill="#2b6fae"/><text class="t" x="350" y="43" text-anchor="middle" fill="#fff">INTA</text><rect class="cell" x="440" y="0" width="180" height="70" fill="#2c8c5e"/><text class="t" x="530" y="43" text-anchor="middle" fill="#fff">INTB</text><rect class="cell" x="620" y="0" width="180" height="70" fill="#b88a00"/><text class="t" x="710" y="43" text-anchor="middle" fill="#fff">INTC</text><rect class="cell" x="800" y="0" width="180" height="70" rx="9" fill="#ca3d4b"/><text class="t" x="890" y="43" text-anchor="middle" fill="#fff">INTD</text>
    <g class="mono" text-anchor="middle"><rect class="cell" x="0" y="70" width="260" height="68" fill="#f1f4f7"/><text x="130" y="112">0</text><rect class="cell" x="260" y="70" width="180" height="68" fill="#e7f1fb"/><text x="350" y="112">PIRQA</text><rect class="cell" x="440" y="70" width="180" height="68" fill="#e9f7ef"/><text x="530" y="112">PIRQB</text><rect class="cell" x="620" y="70" width="180" height="68" fill="#fff3ca"/><text x="710" y="112">PIRQC</text><rect class="cell" x="800" y="70" width="180" height="68" fill="#fcebec"/><text x="890" y="112">PIRQD</text>
    <rect class="cell" x="0" y="138" width="260" height="68" fill="#f1f4f7"/><text x="130" y="180">1</text><rect class="cell" x="260" y="138" width="180" height="68" fill="#e9f7ef"/><text x="350" y="180">PIRQB</text><rect class="cell" x="440" y="138" width="180" height="68" fill="#fff3ca"/><text x="530" y="180">PIRQC</text><rect class="cell" x="620" y="138" width="180" height="68" fill="#fcebec"/><text x="710" y="180">PIRQD</text><rect class="cell" x="800" y="138" width="180" height="68" fill="#e7f1fb"/><text x="890" y="180">PIRQA</text>
    <rect class="cell" x="0" y="206" width="260" height="68" fill="#f1f4f7"/><text x="130" y="248">2</text><rect class="cell" x="260" y="206" width="180" height="68" fill="#fff3ca"/><text x="350" y="248">PIRQC</text><rect class="cell" x="440" y="206" width="180" height="68" fill="#fcebec"/><text x="530" y="248">PIRQD</text><rect class="cell" x="620" y="206" width="180" height="68" fill="#e7f1fb"/><text x="710" y="248">PIRQA</text><rect class="cell" x="800" y="206" width="180" height="68" fill="#e9f7ef"/><text x="890" y="248">PIRQB</text>
    <rect class="cell" x="0" y="274" width="260" height="68" fill="#f1f4f7"/><text x="130" y="316">3</text><rect class="cell" x="260" y="274" width="180" height="68" fill="#fcebec"/><text x="350" y="316">PIRQD</text><rect class="cell" x="440" y="274" width="180" height="68" fill="#e7f1fb"/><text x="530" y="316">PIRQA</text><rect class="cell" x="620" y="274" width="180" height="68" fill="#e9f7ef"/><text x="710" y="316">PIRQB</text><rect class="cell" x="800" y="274" width="180" height="68" fill="#fff3ca"/><text x="890" y="316">PIRQC</text></g></g>
  <rect x="145" y="535" width="910" height="90" rx="14" fill="#e7f1fb" stroke="#2b6fae" stroke-width="2.5"/><text class="formula" x="600" y="573" text-anchor="middle">Upstream Pin = (Device Number + Pin Index) mod 4</text><text class="m" x="600" y="603" text-anchor="middle">表格表达常见桥接轮转模型；实际 IRQ 路由还受 ACPI/固件与操作系统配置影响</text>
</svg>
