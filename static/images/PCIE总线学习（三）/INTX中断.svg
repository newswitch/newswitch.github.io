<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">INTx 中断的共享与 Swizzling</title><desc id="desc">多个设备的 INTA 到 INTD 经 PCIe 桥按 Device Number 轮转映射到系统中断入口。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102740" flood-opacity=".12"/></filter><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:21px;font-weight:700}.m{font-size:16px;fill:#49647e}.box{stroke-width:2.5;rx:13;filter:url(#s)}.w{fill:none;stroke-width:5;stroke-linecap:round}.pin{font:700 17px Consolas,monospace}.note{font-size:17px;font-weight:700}</style></defs>
  <rect width="1200" height="620" fill="#f8fbfd"/><rect y="82" width="1200" height="538" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">INTx Swizzling：让不同设备轮转使用四个传统中断入口</text>
  <g><rect class="box" x="65" y="135" width="235" height="330" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="182" y="175" text-anchor="middle">下游设备</text><text class="m" x="182" y="204" text-anchor="middle">Device Number 决定轮转</text><text class="pin" x="242" y="258" text-anchor="end" fill="#2b6fae">INTA</text><text class="pin" x="242" y="318" text-anchor="end" fill="#2c8c5e">INTB</text><text class="pin" x="242" y="378" text-anchor="end" fill="#b88a00">INTC</text><text class="pin" x="242" y="438" text-anchor="end" fill="#ca3d4b">INTD</text></g>
  <rect class="box" x="470" y="135" width="260" height="330" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="600" y="175" text-anchor="middle">PCIe Bridge</text><text class="m" x="600" y="204" text-anchor="middle">逻辑上执行 Pin Rotation</text><text class="m" x="600" y="285" text-anchor="middle">例如 Device 1：</text><text class="pin" x="600" y="324" text-anchor="middle" fill="#2b5f94">A→B · B→C</text><text class="pin" x="600" y="360" text-anchor="middle" fill="#2b5f94">C→D · D→A</text><text class="m" x="600" y="416" text-anchor="middle">PCIe 链路中承载的是</text><text class="m" x="600" y="442" text-anchor="middle">Assert/Deassert_INTx 消息</text>
  <g><rect class="box" x="900" y="135" width="235" height="330" fill="#e9f7ef" stroke="#2c8c5e"/><text class="t" x="1017" y="175" text-anchor="middle">上游中断入口</text><text class="m" x="1017" y="204" text-anchor="middle">可能被多个设备共享</text><text class="pin" x="958" y="258" fill="#2b6fae">PIRQA</text><text class="pin" x="958" y="318" fill="#2c8c5e">PIRQB</text><text class="pin" x="958" y="378" fill="#b88a00">PIRQC</text><text class="pin" x="958" y="438" fill="#ca3d4b">PIRQD</text></g>
  <path class="w" stroke="#2b6fae" d="M300 252C385 252 400 312 470 312M730 312C800 312 815 312 900 312"/><path class="w" stroke="#2c8c5e" d="M300 312C385 312 400 372 470 372M730 372C800 372 815 372 900 372"/><path class="w" stroke="#b88a00" d="M300 372C385 372 400 432 470 432M730 432C800 432 815 432 900 432"/><path class="w" stroke="#ca3d4b" d="M300 432C385 432 400 252 470 252M730 252C800 252 815 252 900 252"/>
  <rect x="85" y="510" width="1030" height="70" rx="12" fill="#fcebec" stroke="#ca3d4b" stroke-width="2"/><text class="note" x="600" y="539" text-anchor="middle">目的不是增加中断数量，而是把相邻设备尽量分散到 A/B/C/D 四个共享入口</text><text class="m" x="600" y="565" text-anchor="middle">现代高性能设备通常使用 MSI/MSI-X；INTx 主要用于兼容和回退</text>
</svg>
