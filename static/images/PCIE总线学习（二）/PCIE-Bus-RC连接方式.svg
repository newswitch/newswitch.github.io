<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Root Complex 中的 PCIe Bus 派生关系</title><desc id="desc">Host Bridge 派生 Bus 0，Root Port 作为 Bus 0 上的桥设备，再派生下游 Bus。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102740" flood-opacity=".12"/></filter><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:22px;font-weight:700}.m{font-size:17px;fill:#49647e}.box{stroke-width:2.5;rx:14;filter:url(#s)}.line{stroke:#2b5f94;stroke-width:4;fill:none;stroke-linecap:round}.bus{font-size:18px;font-weight:700;fill:#2b5f94}</style></defs>
  <rect width="1200" height="700" fill="#f8fbfd"/><rect y="82" width="1200" height="618" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">Root Complex 如何派生 PCIe Bus</text>
  <rect class="box" x="450" y="112" width="300" height="76" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="600" y="145" text-anchor="middle">CPU / SoC</text><text class="m" x="600" y="173" text-anchor="middle">配置访问从根开始</text>
  <path class="line" d="M600 188V225"/><rect class="box" x="390" y="225" width="420" height="82" fill="#e9f7ef" stroke="#2c8c5e"/><text class="t" x="600" y="260" text-anchor="middle">Host Bridge / Root Complex</text><text class="m" x="600" y="289" text-anchor="middle">向操作系统暴露根总线</text>
  <path class="line" d="M600 307V354"/><text class="bus" x="620" y="340">Bus 0（Root Bus）</text><path class="line" d="M160 354H1040"/>
  <path class="line" d="M220 354V408"/><path class="line" d="M480 354V408"/><path class="line" d="M740 354V408"/><path class="line" d="M1000 354V408"/>
  <g><rect class="box" x="105" y="408" width="230" height="102" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="220" y="447" text-anchor="middle">Root Port</text><text class="m" x="220" y="477" text-anchor="middle">00:01.0 · Type 1</text><text class="m" x="220" y="500" text-anchor="middle">虚拟 PCI-to-PCI Bridge</text></g>
  <g><rect class="box" x="365" y="408" width="230" height="102" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="480" y="447" text-anchor="middle">Root Port</text><text class="m" x="480" y="477" text-anchor="middle">00:02.0 · Type 1</text><text class="m" x="480" y="500" text-anchor="middle">派生独立下游总线</text></g>
  <g><rect class="box" x="625" y="408" width="230" height="102" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="740" y="447" text-anchor="middle">Root Port</text><text class="m" x="740" y="477" text-anchor="middle">00:03.0 · Type 1</text><text class="m" x="740" y="500" text-anchor="middle">可连接 EP 或 Switch</text></g>
  <g><rect class="box" x="905" y="408" width="190" height="102" fill="#f1f4f7" stroke="#718296"/><text class="t" x="1000" y="461" text-anchor="middle">…</text><text class="m" x="1000" y="492" text-anchor="middle">更多 Root Port</text></g>
  <path class="line" d="M220 510V558"/><path class="line" d="M480 510V558"/><path class="line" d="M740 510V558"/>
  <rect class="box" x="105" y="558" width="230" height="78" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="220" y="591" text-anchor="middle">Bus 1</text><text class="m" x="220" y="619" text-anchor="middle">Endpoint 位于 01:00.0</text>
  <rect class="box" x="365" y="558" width="230" height="78" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="480" y="591" text-anchor="middle">Bus 2</text><text class="m" x="480" y="619" text-anchor="middle">独立编号空间</text>
  <rect class="box" x="625" y="558" width="230" height="78" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="740" y="591" text-anchor="middle">Bus 3</text><text class="m" x="740" y="619" text-anchor="middle">还可继续派生子总线</text>
  <text class="m" x="600" y="676" text-anchor="middle">桥本身属于上游 Bus；桥的 Secondary Bus Number 指向其下游 Bus</text>
</svg>
