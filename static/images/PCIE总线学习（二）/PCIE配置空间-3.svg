<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">PCI Command Register 位定义</title><desc id="desc">16 位 Command 寄存器中常用控制位，包括 I/O、Memory、Bus Master、Parity、SERR 和 Interrupt Disable。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:18px;font-weight:700}.m{font-size:16px;fill:#49647e}.bit{font:700 15px Consolas,monospace;fill:#49647e}.cell{stroke:#fff;stroke-width:3}.key{font-size:17px;font-weight:700}</style></defs>
  <rect width="1200" height="500" fill="#f8fbfd"/><rect y="82" width="1200" height="418" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">Command Register（Offset 04h）：驱动能否访问与发起事务</text>
  <g transform="translate(60 145)"><g class="bit" text-anchor="middle"><text x="33" y="-12">15</text><text x="99" y="-12">14</text><text x="165" y="-12">13</text><text x="231" y="-12">12</text><text x="297" y="-12">11</text><text x="363" y="-12">10</text><text x="429" y="-12">9</text><text x="495" y="-12">8</text><text x="561" y="-12">7</text><text x="627" y="-12">6</text><text x="693" y="-12">5</text><text x="759" y="-12">4</text><text x="825" y="-12">3</text><text x="891" y="-12">2</text><text x="957" y="-12">1</text><text x="1023" y="-12">0</text></g>
    <rect class="cell" x="0" y="0" width="330" height="82" rx="8" fill="#f1f4f7"/><text class="t" x="165" y="34" text-anchor="middle">Reserved</text><text class="m" x="165" y="59" text-anchor="middle">Bits 15:11</text>
    <rect class="cell" x="330" y="0" width="66" height="82" fill="#fcebec"/><text class="t" x="363" y="31" text-anchor="middle">INT</text><text class="m" x="363" y="57" text-anchor="middle">禁用</text>
    <rect class="cell" x="396" y="0" width="66" height="82" fill="#f1f4f7"/><text class="m" x="429" y="46" text-anchor="middle">FBB</text>
    <rect class="cell" x="462" y="0" width="66" height="82" fill="#fff3ca"/><text class="m" x="495" y="34" text-anchor="middle">SERR#</text><text class="m" x="495" y="58" text-anchor="middle">Enable</text>
    <rect class="cell" x="528" y="0" width="66" height="82" fill="#f1f4f7"/><text class="m" x="561" y="46" text-anchor="middle">Wait</text>
    <rect class="cell" x="594" y="0" width="66" height="82" fill="#fff3ca"/><text class="m" x="627" y="34" text-anchor="middle">Parity</text><text class="m" x="627" y="58" text-anchor="middle">响应</text>
    <rect class="cell" x="660" y="0" width="132" height="82" fill="#f1f4f7"/><text class="m" x="726" y="34" text-anchor="middle">VGA Snoop /</text><text class="m" x="726" y="58" text-anchor="middle">MWI</text>
    <rect class="cell" x="792" y="0" width="66" height="82" fill="#f1f4f7"/><text class="m" x="825" y="46" text-anchor="middle">Special</text>
    <rect class="cell" x="858" y="0" width="66" height="82" fill="#e9f7ef"/><text class="m" x="891" y="34" text-anchor="middle">Bus</text><text class="m" x="891" y="58" text-anchor="middle">Master</text>
    <rect class="cell" x="924" y="0" width="66" height="82" fill="#e7f1fb"/><text class="m" x="957" y="34" text-anchor="middle">Memory</text><text class="m" x="957" y="58" text-anchor="middle">Space</text>
    <rect class="cell" x="990" y="0" width="66" height="82" rx="8" fill="#e7f1fb"/><text class="m" x="1023" y="34" text-anchor="middle">I/O</text><text class="m" x="1023" y="58" text-anchor="middle">Space</text>
  </g>
  <g transform="translate(80 285)"><rect width="315" height="126" rx="12" fill="#e7f1fb" stroke="#2b6fae" stroke-width="2"/><text class="key" x="20" y="34">Bit 0 / 1：地址译码开关</text><text class="m" x="20" y="66">允许响应 I/O Space 或 Memory Space</text><text class="m" x="20" y="96">未开启时，对应 BAR 不接收访问</text>
    <rect x="443" width="315" height="126" rx="12" fill="#e9f7ef" stroke="#2c8c5e" stroke-width="2"/><text class="key" x="463" y="34">Bit 2：Bus Master Enable</text><text class="m" x="463" y="66">允许设备主动发起 Memory / I/O 请求</text><text class="m" x="463" y="96">DMA 通常依赖此位</text>
    <rect x="786" width="315" height="126" rx="12" fill="#fcebec" stroke="#ca3d4b" stroke-width="2"/><text class="key" x="806" y="34">Bit 10：Interrupt Disable</text><text class="m" x="806" y="66">控制传统 INTx，不等同于关闭 MSI-X</text><text class="m" x="806" y="96">排障时需结合 Capability 判断</text></g>
  <text class="m" x="600" y="468" text-anchor="middle">lspci 中常见的 I/O+、Mem+、BusMaster+ 就来自这些控制位</text>
</svg>
