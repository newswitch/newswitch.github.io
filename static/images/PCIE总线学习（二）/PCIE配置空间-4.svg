<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">PCI Status Register 位定义</title><desc id="desc">16 位 Status 寄存器中常用状态位，包括能力链、INTx 状态、DEVSEL 时序和传统错误状态。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:17px;font-weight:700}.m{font-size:15px;fill:#49647e}.bit{font:700 14px Consolas,monospace;fill:#49647e}.cell{stroke:#fff;stroke-width:3}.key{font-size:17px;font-weight:700}</style></defs>
  <rect width="1200" height="530" fill="#f8fbfd"/><rect y="82" width="1200" height="448" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">Status Register（Offset 06h）：能力存在性与传统错误状态</text>
  <g transform="translate(54 145)"><g class="bit" text-anchor="middle"><text x="34" y="-12">15</text><text x="102" y="-12">14</text><text x="170" y="-12">13</text><text x="238" y="-12">12</text><text x="306" y="-12">11</text><text x="374" y="-12">10:9</text><text x="476" y="-12">8</text><text x="544" y="-12">7</text><text x="612" y="-12">6</text><text x="680" y="-12">5</text><text x="748" y="-12">4</text><text x="816" y="-12">3</text><text x="986" y="-12">2:0</text></g>
    <rect class="cell" x="0" y="0" width="68" height="94" rx="8" fill="#fcebec"/><text class="m" x="34" y="34" text-anchor="middle">Parity</text><text class="m" x="34" y="59" text-anchor="middle">Error</text>
    <rect class="cell" x="68" y="0" width="68" height="94" fill="#fcebec"/><text class="m" x="102" y="34" text-anchor="middle">System</text><text class="m" x="102" y="59" text-anchor="middle">Error</text>
    <rect class="cell" x="136" y="0" width="68" height="94" fill="#fcebec"/><text class="m" x="170" y="29" text-anchor="middle">Master</text><text class="m" x="170" y="53" text-anchor="middle">Abort</text><text class="m" x="170" y="76" text-anchor="middle">Recv</text>
    <rect class="cell" x="204" y="0" width="68" height="94" fill="#fcebec"/><text class="m" x="238" y="29" text-anchor="middle">Target</text><text class="m" x="238" y="53" text-anchor="middle">Abort</text><text class="m" x="238" y="76" text-anchor="middle">Recv</text>
    <rect class="cell" x="272" y="0" width="68" height="94" fill="#fcebec"/><text class="m" x="306" y="29" text-anchor="middle">Target</text><text class="m" x="306" y="53" text-anchor="middle">Abort</text><text class="m" x="306" y="76" text-anchor="middle">Sent</text>
    <rect class="cell" x="340" y="0" width="102" height="94" fill="#fff3ca"/><text class="t" x="391" y="39" text-anchor="middle">DEVSEL</text><text class="m" x="391" y="66" text-anchor="middle">Timing</text>
    <rect class="cell" x="442" y="0" width="68" height="94" fill="#fcebec"/><text class="m" x="476" y="29" text-anchor="middle">Master</text><text class="m" x="476" y="53" text-anchor="middle">Data</text><text class="m" x="476" y="76" text-anchor="middle">Parity</text>
    <rect class="cell" x="510" y="0" width="68" height="94" fill="#f1f4f7"/><text class="m" x="544" y="39" text-anchor="middle">Fast</text><text class="m" x="544" y="65" text-anchor="middle">B2B</text>
    <rect class="cell" x="578" y="0" width="68" height="94" fill="#f1f4f7"/><text class="m" x="612" y="52" text-anchor="middle">Reserved</text>
    <rect class="cell" x="646" y="0" width="68" height="94" fill="#f1f4f7"/><text class="m" x="680" y="39" text-anchor="middle">66MHz</text><text class="m" x="680" y="65" text-anchor="middle">Capable</text>
    <rect class="cell" x="714" y="0" width="68" height="94" fill="#e9f7ef"/><text class="m" x="748" y="39" text-anchor="middle">Caps</text><text class="m" x="748" y="65" text-anchor="middle">List</text>
    <rect class="cell" x="782" y="0" width="68" height="94" fill="#e7f1fb"/><text class="m" x="816" y="39" text-anchor="middle">INTx</text><text class="m" x="816" y="65" text-anchor="middle">Status</text>
    <rect class="cell" x="850" y="0" width="204" height="94" rx="8" fill="#f1f4f7"/><text class="t" x="952" y="53" text-anchor="middle">Reserved</text>
  </g>
  <g transform="translate(72 300)"><rect width="330" height="132" rx="12" fill="#e9f7ef" stroke="#2c8c5e" stroke-width="2"/><text class="key" x="20" y="35">Bit 4：Capabilities List</text><text class="m" x="20" y="68">为 1 表示 34h 的 Capability Pointer 有效</text><text class="m" x="20" y="99">MSI、MSI-X、PCIe Capability 由此查找</text>
    <rect x="364" width="330" height="132" rx="12" fill="#e7f1fb" stroke="#2b6fae" stroke-width="2"/><text class="key" x="384" y="35">Bit 3：Interrupt Status</text><text class="m" x="384" y="68">表示传统 INTx 中断处于挂起状态</text><text class="m" x="384" y="99">不能用它判断 MSI/MSI-X 是否活跃</text>
    <rect x="728" width="330" height="132" rx="12" fill="#fcebec" stroke="#ca3d4b" stroke-width="2"/><text class="key" x="748" y="35">Bits 8、11–15：错误状态</text><text class="m" x="748" y="68">主要是传统 PCI 的 Parity/Abort/SERR 语义</text><text class="m" x="748" y="99">PCIe 详细错误应继续看 AER Capability</text></g>
  <text class="m" x="600" y="496" text-anchor="middle">Status 多数错误位采用 Write-1-to-Clear；排障前先保存原值，避免读取工具或驱动改变现场</text>
</svg>
