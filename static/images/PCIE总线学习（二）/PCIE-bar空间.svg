<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">PCIe BAR 的位布局与地址映射</title><desc id="desc">展示 Memory BAR 和 I/O BAR 的低位属性以及操作系统将 CPU 地址窗口写入 BAR 后形成的 MMIO 映射。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2b5f94"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:21px;font-weight:700}.m{font-size:16px;fill:#49647e}.bit{font:700 15px Consolas,monospace;fill:#49647e}.cell{stroke:#fff;stroke-width:3}.line{stroke:#2b5f94;stroke-width:4;fill:none;marker-end:url(#a)}.lab{font-size:17px;font-weight:700}</style></defs>
  <rect width="1200" height="610" fill="#f8fbfd"/><rect y="82" width="1200" height="528" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">BAR：设备声明空间需求，固件/操作系统分配 CPU 地址窗口</text>
  <text class="t" x="60" y="132">Memory BAR（32-bit 寄存器视图）</text>
  <g transform="translate(60 164)"><text class="bit" x="0" y="-12">31</text><text class="bit" x="755" y="-12">4</text><text class="bit" x="827" y="-12">3</text><text class="bit" x="916" y="-12">2:1</text><text class="bit" x="1045" y="-12">0</text>
    <rect class="cell" x="0" y="0" width="790" height="86" rx="8" fill="#e7f1fb"/><text class="t" x="395" y="38" text-anchor="middle">Base Address（低位按空间大小对齐）</text><text class="m" x="395" y="65" text-anchor="middle">64-bit BAR 会占用两个相邻 BAR 寄存器</text>
    <rect class="cell" x="790" y="0" width="90" height="86" fill="#e9f7ef"/><text class="m" x="835" y="35" text-anchor="middle">Prefetch</text><text class="m" x="835" y="61" text-anchor="middle">able</text>
    <rect class="cell" x="880" y="0" width="130" height="86" fill="#fff3ca"/><text class="m" x="945" y="35" text-anchor="middle">Type</text><text class="m" x="945" y="61" text-anchor="middle">32/64-bit</text>
    <rect class="cell" x="1010" y="0" width="70" height="86" rx="8" fill="#fcebec"/><text class="m" x="1045" y="35" text-anchor="middle">0</text><text class="m" x="1045" y="61" text-anchor="middle">Memory</text></g>
  <text class="t" x="60" y="302">I/O BAR（传统兼容用途）</text>
  <g transform="translate(60 334)"><text class="bit" x="0" y="-12">31</text><text class="bit" x="925" y="-12">2</text><text class="bit" x="1045" y="-12">0</text><rect class="cell" x="0" y="0" width="970" height="78" rx="8" fill="#e7f1fb"/><text class="t" x="485" y="47" text-anchor="middle">I/O Base Address（Bits 31:2）</text><rect class="cell" x="970" y="0" width="110" height="78" rx="8" fill="#fcebec"/><text class="m" x="1025" y="33" text-anchor="middle">Bit 0 = 1</text><text class="m" x="1025" y="58" text-anchor="middle">I/O Space</text></g>
  <g transform="translate(75 455)"><rect width="250" height="100" rx="12" fill="#e9f7ef" stroke="#2c8c5e" stroke-width="2.5"/><text class="t" x="125" y="38" text-anchor="middle">设备硬件能力</text><text class="m" x="125" y="70" text-anchor="middle">空间大小 / 32或64位 / 属性</text><path class="line" d="M250 50H405"/><rect x="405" width="300" height="100" rx="12" fill="#fff3ca" stroke="#b88a00" stroke-width="2.5"/><text class="t" x="555" y="38" text-anchor="middle">固件 / 操作系统分配</text><text class="m" x="555" y="70" text-anchor="middle">探测大小并写入 Base Address</text><path class="line" d="M705 50H860"/><rect x="860" width="250" height="100" rx="12" fill="#e7f1fb" stroke="#2b6fae" stroke-width="2.5"/><text class="t" x="985" y="38" text-anchor="middle">CPU MMIO 访问</text><text class="m" x="985" y="70" text-anchor="middle">地址经 RC 路由到设备</text></g>
  <text class="m" x="600" y="590" text-anchor="middle">BAR 保存的是地址窗口基址和属性，不是设备数据本身；设备寄存器/显存窗口位于其映射目标空间</text>
</svg>
