<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">PCIe Switch 中的 Bus 派生关系</title><desc id="desc">Switch 的上游端口连接 Bus X，内部多个下游端口作为桥设备分别派生 Bus X+1 等子总线。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102740" flood-opacity=".12"/></filter><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:22px;font-weight:700}.m{font-size:17px;fill:#49647e}.box{stroke-width:2.5;rx:14;filter:url(#s)}.line{stroke:#2b5f94;stroke-width:4;fill:none;stroke-linecap:round}.bus{font-size:18px;font-weight:700;fill:#2b5f94}</style></defs>
  <rect width="1200" height="670" fill="#f8fbfd"/><rect y="82" width="1200" height="588" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">PCIe Switch 如何继续派生子总线</text>
  <rect class="box" x="420" y="112" width="360" height="78" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="600" y="145" text-anchor="middle">上游 Root Port / Switch Port</text><text class="m" x="600" y="174" text-anchor="middle">所属总线：Bus X - 1</text>
  <path class="line" d="M600 190V228"/><rect class="box" x="405" y="228" width="390" height="82" fill="#e9f7ef" stroke="#2c8c5e"/><text class="t" x="600" y="263" text-anchor="middle">Switch Upstream Port</text><text class="m" x="600" y="291" text-anchor="middle">作为桥，派生 Secondary Bus X</text>
  <path class="line" d="M600 310V354"/><text class="bus" x="620" y="341">Bus X（Switch 内部总线）</text><path class="line" d="M160 354H1040"/>
  <path class="line" d="M210 354V402"/><path class="line" d="M470 354V402"/><path class="line" d="M730 354V402"/><path class="line" d="M990 354V402"/>
  <g><rect class="box" x="90" y="402" width="240" height="94" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="210" y="439" text-anchor="middle">Downstream Port 1</text><text class="m" x="210" y="470" text-anchor="middle">Bus X 上的桥设备</text></g>
  <g><rect class="box" x="350" y="402" width="240" height="94" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="470" y="439" text-anchor="middle">Downstream Port 2</text><text class="m" x="470" y="470" text-anchor="middle">Bus X 上的桥设备</text></g>
  <g><rect class="box" x="610" y="402" width="240" height="94" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="730" y="439" text-anchor="middle">Downstream Port 3</text><text class="m" x="730" y="470" text-anchor="middle">Bus X 上的桥设备</text></g>
  <g><rect class="box" x="880" y="402" width="220" height="94" fill="#f1f4f7" stroke="#718296"/><text class="t" x="990" y="442" text-anchor="middle">… Port N</text><text class="m" x="990" y="471" text-anchor="middle">按需继续扩展</text></g>
  <path class="line" d="M210 496V544"/><path class="line" d="M470 496V544"/><path class="line" d="M730 496V544"/>
  <rect class="box" x="95" y="544" width="230" height="72" fill="#fcebec" stroke="#ca3d4b"/><text class="t" x="210" y="589" text-anchor="middle">Bus X + 1</text>
  <rect class="box" x="355" y="544" width="230" height="72" fill="#fcebec" stroke="#ca3d4b"/><text class="t" x="470" y="589" text-anchor="middle">Bus X + 2</text>
  <rect class="box" x="615" y="544" width="230" height="72" fill="#fcebec" stroke="#ca3d4b"/><text class="t" x="730" y="589" text-anchor="middle">Bus X + 3</text>
  <text class="m" x="600" y="653" text-anchor="middle">每个 Downstream Port 都有独立的 Secondary/Subordinate Bus Number 范围</text>
</svg>
