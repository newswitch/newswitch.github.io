<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">PCI 配置空间 Type 0 和 Type 1 Header</title><desc id="desc">对比端点设备与桥设备前 64 字节配置头的关键字段，并展示后续 Capability 空间。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:22px;font-weight:700}.m{font-size:15px;fill:#49647e}.cell{stroke:#fff;stroke-width:3}.off{font:700 15px Consolas,monospace;fill:#49647e}.cap{font-size:17px;font-weight:700}</style></defs>
  <rect width="1200" height="960" fill="#f8fbfd"/><rect y="82" width="1200" height="878" fill="url(#g)" opacity=".55"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">配置空间前 64B：Endpoint 与 Bridge 的 Header 不同</text>
  <text class="t" x="315" y="130" text-anchor="middle">Type 0 Header：普通 Endpoint</text><text class="t" x="885" y="130" text-anchor="middle">Type 1 Header：PCI-to-PCI Bridge</text>
  <g transform="translate(65 158)">
    <text class="off" x="0" y="24">00h</text><rect class="cell" x="45" y="0" width="250" height="48" fill="#e7f1fb"/><rect class="cell" x="295" y="0" width="250" height="48" fill="#e7f1fb"/><text class="cap" x="170" y="30" text-anchor="middle">Vendor ID</text><text class="cap" x="420" y="30" text-anchor="middle">Device ID</text>
    <text class="off" x="0" y="76">04h</text><rect class="cell" x="45" y="52" width="250" height="48" fill="#fff3ca"/><rect class="cell" x="295" y="52" width="250" height="48" fill="#fff3ca"/><text class="cap" x="170" y="82" text-anchor="middle">Command</text><text class="cap" x="420" y="82" text-anchor="middle">Status</text>
    <text class="off" x="0" y="128">08h</text><rect class="cell" x="45" y="104" width="125" height="48" fill="#e9f7ef"/><rect class="cell" x="170" y="104" width="375" height="48" fill="#e9f7ef"/><text class="m" x="107" y="134" text-anchor="middle">Revision</text><text class="cap" x="357" y="134" text-anchor="middle">Class Code</text>
    <text class="off" x="0" y="180">0Ch</text><rect class="cell" x="45" y="156" width="375" height="48" fill="#f1f4f7"/><rect class="cell" x="420" y="156" width="125" height="48" fill="#fcebec"/><text class="m" x="232" y="186" text-anchor="middle">Cache / Latency / BIST</text><text class="cap" x="482" y="186" text-anchor="middle">Header Type</text>
    <text class="off" x="0" y="232">10h</text><rect class="cell" x="45" y="208" width="500" height="48" fill="#dbeafe"/><text class="cap" x="295" y="238" text-anchor="middle">BAR 0</text>
    <text class="off" x="0" y="284">14h</text><rect class="cell" x="45" y="260" width="500" height="48" fill="#dbeafe"/><text class="cap" x="295" y="290" text-anchor="middle">BAR 1</text>
    <text class="off" x="0" y="336">18h</text><rect class="cell" x="45" y="312" width="500" height="48" fill="#dbeafe"/><text class="cap" x="295" y="342" text-anchor="middle">BAR 2</text>
    <text class="off" x="0" y="388">1Ch</text><rect class="cell" x="45" y="364" width="500" height="48" fill="#dbeafe"/><text class="cap" x="295" y="394" text-anchor="middle">BAR 3</text>
    <text class="off" x="0" y="440">20h</text><rect class="cell" x="45" y="416" width="500" height="48" fill="#dbeafe"/><text class="cap" x="295" y="446" text-anchor="middle">BAR 4</text>
    <text class="off" x="0" y="492">24h</text><rect class="cell" x="45" y="468" width="500" height="48" fill="#dbeafe"/><text class="cap" x="295" y="498" text-anchor="middle">BAR 5</text>
    <text class="off" x="0" y="544">28h</text><rect class="cell" x="45" y="520" width="500" height="48" fill="#f1f4f7"/><text class="m" x="295" y="550" text-anchor="middle">CardBus CIS Pointer</text>
    <text class="off" x="0" y="596">2Ch</text><rect class="cell" x="45" y="572" width="500" height="48" fill="#f1f4f7"/><text class="m" x="295" y="602" text-anchor="middle">Subsystem Vendor / Subsystem ID</text>
    <text class="off" x="0" y="648">30h</text><rect class="cell" x="45" y="624" width="500" height="48" fill="#f1f4f7"/><text class="m" x="295" y="654" text-anchor="middle">Expansion ROM Base</text>
    <text class="off" x="0" y="700">34h</text><rect class="cell" x="45" y="676" width="500" height="48" fill="#f7efff"/><text class="cap" x="295" y="706" text-anchor="middle">Capabilities Pointer</text>
  </g>
  <g transform="translate(635 158)">
    <text class="off" x="0" y="24">00h</text><rect class="cell" x="45" y="0" width="250" height="48" fill="#e7f1fb"/><rect class="cell" x="295" y="0" width="250" height="48" fill="#e7f1fb"/><text class="cap" x="170" y="30" text-anchor="middle">Vendor ID</text><text class="cap" x="420" y="30" text-anchor="middle">Device ID</text>
    <text class="off" x="0" y="76">04h</text><rect class="cell" x="45" y="52" width="250" height="48" fill="#fff3ca"/><rect class="cell" x="295" y="52" width="250" height="48" fill="#fff3ca"/><text class="cap" x="170" y="82" text-anchor="middle">Command</text><text class="cap" x="420" y="82" text-anchor="middle">Status</text>
    <text class="off" x="0" y="128">08h</text><rect class="cell" x="45" y="104" width="125" height="48" fill="#e9f7ef"/><rect class="cell" x="170" y="104" width="375" height="48" fill="#e9f7ef"/><text class="m" x="107" y="134" text-anchor="middle">Revision</text><text class="cap" x="357" y="134" text-anchor="middle">Class Code</text>
    <text class="off" x="0" y="180">0Ch</text><rect class="cell" x="45" y="156" width="375" height="48" fill="#f1f4f7"/><rect class="cell" x="420" y="156" width="125" height="48" fill="#fcebec"/><text class="m" x="232" y="186" text-anchor="middle">Cache / Latency / BIST</text><text class="cap" x="482" y="186" text-anchor="middle">Header Type</text>
    <text class="off" x="0" y="232">10h</text><rect class="cell" x="45" y="208" width="500" height="48" fill="#dbeafe"/><text class="cap" x="295" y="238" text-anchor="middle">BAR 0</text>
    <text class="off" x="0" y="284">14h</text><rect class="cell" x="45" y="260" width="500" height="48" fill="#dbeafe"/><text class="cap" x="295" y="290" text-anchor="middle">BAR 1</text>
    <text class="off" x="0" y="336">18h</text><rect class="cell" x="45" y="312" width="166" height="48" fill="#fcebec"/><rect class="cell" x="211" y="312" width="167" height="48" fill="#fcebec"/><rect class="cell" x="378" y="312" width="167" height="48" fill="#fcebec"/><text class="m" x="128" y="342" text-anchor="middle">Primary Bus</text><text class="m" x="294" y="342" text-anchor="middle">Secondary</text><text class="m" x="461" y="342" text-anchor="middle">Subordinate</text>
    <text class="off" x="0" y="388">1Ch</text><rect class="cell" x="45" y="364" width="500" height="48" fill="#e9f7ef"/><text class="cap" x="295" y="394" text-anchor="middle">I/O Base / I/O Limit</text>
    <text class="off" x="0" y="440">20h</text><rect class="cell" x="45" y="416" width="500" height="48" fill="#e9f7ef"/><text class="cap" x="295" y="446" text-anchor="middle">Memory Base / Memory Limit</text>
    <text class="off" x="0" y="492">24h</text><rect class="cell" x="45" y="468" width="500" height="48" fill="#e9f7ef"/><text class="cap" x="295" y="498" text-anchor="middle">Prefetchable Memory Window</text>
    <text class="off" x="0" y="544">28h</text><rect class="cell" x="45" y="520" width="500" height="48" fill="#f1f4f7"/><text class="m" x="295" y="550" text-anchor="middle">Prefetchable Base Upper 32 Bits</text>
    <text class="off" x="0" y="596">2Ch</text><rect class="cell" x="45" y="572" width="500" height="48" fill="#f1f4f7"/><text class="m" x="295" y="602" text-anchor="middle">Prefetchable Limit Upper 32 Bits</text>
    <text class="off" x="0" y="648">30h</text><rect class="cell" x="45" y="624" width="500" height="48" fill="#f1f4f7"/><text class="m" x="295" y="654" text-anchor="middle">I/O Base/Limit Upper · ROM Base</text>
    <text class="off" x="0" y="700">34h</text><rect class="cell" x="45" y="676" width="500" height="48" fill="#f7efff"/><text class="cap" x="295" y="706" text-anchor="middle">Capabilities Pointer · Bridge Control</text>
  </g>
  <text class="m" x="600" y="930" text-anchor="middle">图中合并了部分保留字段；重点是识别字段职责，不建议靠记忆偏移替代规范或 lspci 输出</text>
</svg>
