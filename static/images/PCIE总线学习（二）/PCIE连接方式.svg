<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">PCIe 树的 Bus Device Function 编号示例</title><desc id="desc">从 Bus 0 开始，经两个 Switch 派生 Bus 1 至 Bus 8，展示桥设备和端点在各自总线上的 Device 编号。</desc>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102740" flood-opacity=".12"/></filter><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#13263d}.h{font-size:30px;font-weight:700;fill:#fff}.t{font-size:20px;font-weight:700}.m{font-size:15px;fill:#49647e}.box{stroke-width:2.2;rx:12;filter:url(#s)}.line{stroke:#2b5f94;stroke-width:3.5;fill:none;stroke-linecap:round}.bus{font-size:17px;font-weight:700;fill:#2b5f94}</style></defs>
  <rect width="1200" height="920" fill="#f8fbfd"/><rect y="82" width="1200" height="838" fill="url(#g)" opacity=".6"/><rect width="1200" height="82" fill="#102740"/><text class="h" x="42" y="52">BDF 编号示例：每条 Bus 都有自己的 Device 编号空间</text>
  <rect class="box" x="455" y="110" width="290" height="66" fill="#e9f7ef" stroke="#2c8c5e"/><text class="t" x="600" y="151" text-anchor="middle">Root Complex</text>
  <path class="line" d="M600 176V222"/><path class="line" d="M235 222H965"/><text class="bus" x="600" y="211" text-anchor="middle">Bus 0</text>
  <path class="line" d="M235 222V260"/><path class="line" d="M965 222V260"/>
  <rect class="box" x="120" y="260" width="230" height="78" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="235" y="292" text-anchor="middle">Root Port A</text><text class="m" x="235" y="320" text-anchor="middle">00:00.0 → Bus 1</text>
  <rect class="box" x="850" y="260" width="230" height="78" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="965" y="292" text-anchor="middle">Endpoint</text><text class="m" x="965" y="320" text-anchor="middle">00:01.0</text>
  <path class="line" d="M235 338V382"/><text class="bus" x="255" y="370">Bus 1</text><rect class="box" x="120" y="382" width="230" height="78" fill="#fcebec" stroke="#ca3d4b"/><text class="t" x="235" y="414" text-anchor="middle">Switch 1 · Upstream</text><text class="m" x="235" y="442" text-anchor="middle">01:00.0 → 内部 Bus 2</text>
  <path class="line" d="M235 460V505"/><path class="line" d="M90 505H505"/><text class="bus" x="255" y="494">Bus 2</text><path class="line" d="M110 505V545"/><path class="line" d="M250 505V545"/><path class="line" d="M390 505V545"/>
  <g><rect class="box" x="40" y="545" width="140" height="74" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="110" y="574" text-anchor="middle">Port A</text><text class="m" x="110" y="602" text-anchor="middle">02:00.0</text></g>
  <g><rect class="box" x="180" y="545" width="140" height="74" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="250" y="574" text-anchor="middle">Port B</text><text class="m" x="250" y="602" text-anchor="middle">02:01.0</text></g>
  <g><rect class="box" x="320" y="545" width="140" height="74" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="390" y="574" text-anchor="middle">Port C</text><text class="m" x="390" y="602" text-anchor="middle">02:02.0</text></g>
  <path class="line" d="M110 619V663"/><path class="line" d="M250 619V663"/><path class="line" d="M390 619V663"/>
  <g><rect class="box" x="35" y="663" width="150" height="76" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="110" y="695" text-anchor="middle">Bus 3 · EP</text><text class="m" x="110" y="722" text-anchor="middle">03:00.0</text></g>
  <g><rect class="box" x="175" y="663" width="150" height="76" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="250" y="695" text-anchor="middle">Bus 4 · EP</text><text class="m" x="250" y="722" text-anchor="middle">04:00.0</text></g>
  <g><rect class="box" x="315" y="663" width="150" height="76" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="390" y="695" text-anchor="middle">Bus 5 · EP</text><text class="m" x="390" y="722" text-anchor="middle">05:00.0</text></g>
  <rect class="box" x="710" y="382" width="250" height="78" fill="#fcebec" stroke="#ca3d4b"/><text class="t" x="835" y="414" text-anchor="middle">Switch 2 · Upstream</text><text class="m" x="835" y="442" text-anchor="middle">Bus 6 上的 06:00.0</text>
  <path class="line" d="M350 299H620V421H710"/><text class="bus" x="632" y="409">Bus 6</text>
  <path class="line" d="M835 460V505"/><path class="line" d="M690 505H980"/><text class="bus" x="835" y="494" text-anchor="middle">Switch 内部 Bus</text><path class="line" d="M715 505V545"/><path class="line" d="M955 505V545"/>
  <rect class="box" x="625" y="545" width="180" height="74" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="715" y="574" text-anchor="middle">Downstream A</text><text class="m" x="715" y="602" text-anchor="middle">派生 Bus 7</text>
  <rect class="box" x="865" y="545" width="180" height="74" fill="#fff3ca" stroke="#b88a00"/><text class="t" x="955" y="574" text-anchor="middle">Downstream B</text><text class="m" x="955" y="602" text-anchor="middle">派生 Bus 8</text>
  <path class="line" d="M715 619V663"/><path class="line" d="M955 619V663"/>
  <rect class="box" x="630" y="663" width="170" height="76" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="715" y="695" text-anchor="middle">Bus 7 · EP</text><text class="m" x="715" y="722" text-anchor="middle">07:00.0</text>
  <rect class="box" x="870" y="663" width="170" height="76" fill="#e7f1fb" stroke="#2b6fae"/><text class="t" x="955" y="695" text-anchor="middle">Bus 8 · EP</text><text class="m" x="955" y="722" text-anchor="middle">08:00.0</text>
  <rect x="80" y="800" width="1040" height="78" rx="12" fill="#f1f4f7" stroke="#718296" stroke-width="2"/><text class="t" x="600" y="833" text-anchor="middle">BDF = Bus:Device.Function</text><text class="m" x="600" y="860" text-anchor="middle">Bus 号在整棵树中唯一；Device 号只在所属 Bus 内编号；Function 号只在所属 Device 内编号</text>
</svg>
