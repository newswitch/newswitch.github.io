<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">Boot 自动配置：候选、条件与默认实现</title><desc id="desc">先发现候选，再评估条件；不是“加依赖后全部 Bean 必定启用”。自动配置一般用于提供默认行为；显式自定义需要验证是否正确替换。。候选发现、条件满足与 Bean 创建成功是三种不同事实。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">Boot 自动配置：候选、条件与默认实现</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">先发现候选，再评估条件；不是“加依赖后全部 Bean 必定启用”</text><rect x="30" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">依赖进入 classpath</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">Starter 聚合依赖</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">BOM 管理版本而非注册 Bean</text><rect x="410" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">发现候选</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">AutoConfiguration.imports</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">列出自动配置类</text><rect x="790" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">排序与条件</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">类、属性、Web 类型等</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不同条件在不同阶段判断</text><rect x="790" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">注册相应定义</text><text x="810" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">用户 Bean 可使默认退让</text><text x="810" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不是所有条件都相同</text><rect x="410" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="430" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">创建与初始化</text><text x="430" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">容器依赖解析和生命周期</text><text x="430" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">实际得到对象或代理</text><rect x="30" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="50" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">观察结果</text><text x="50" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">条件评估报告 + Bean 来源</text><text x="50" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">用边界测试解释启用与退让</text><path d="M330 210 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 210 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M940 275 V348" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M790 425 H722" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M410 425 H342" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">自动配置一般用于提供默认行为；显式自定义需要验证是否正确替换。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">候选发现、条件满足与 Bean 创建成功是三种不同事实。</text></g></svg>
