<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">常见外部配置：覆盖来源与绑定</title><desc id="desc">只展示常见来源的相对优先级；省略测试、特殊 JSON 等来源。图按优先级从高到低阅读，不表示文件加载的全部时序。。环境值覆盖之后还要转换与校验；“文件里写了”不代表最终生效。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">常见外部配置：覆盖来源与绑定</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">只展示常见来源的相对优先级；省略测试、特殊 JSON 等来源</text><rect x="30" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">高：命令行参数</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">例如 --server.port=8081</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">安全信息不放进参数</text><rect x="410" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">Java 系统属性</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">例如 -Dserver.port=8081</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">注意位置在 -jar 之前</text><rect x="790" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">操作系统环境变量</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">例如 SERVER_PORT</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">名称映射要符合绑定规则</text><rect x="790" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">外部配置文件</text><text x="810" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">含相应 Profile 文件</text><text x="810" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">位置与导入影响覆盖</text><rect x="410" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="430" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">包内配置文件</text><text x="430" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">application 与 Profile</text><text x="430" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不是最终值的唯一来源</text><rect x="30" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="50" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">低：默认属性</text><text x="50" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">程序提供回退值</text><text x="50" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">最终转换、绑定与校验</text><path d="M330 210 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 210 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M940 275 V348" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M790 425 H722" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M410 425 H342" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">图按优先级从高到低阅读，不表示文件加载的全部时序。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">环境值覆盖之后还要转换与校验；“文件里写了”不代表最终生效。</text></g></svg>
