<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">AOP：外部调用与自调用的边界</title><desc id="desc">普通 Spring 代理模型；不包含 AspectJ 编织。JDK 代理不能当目标实现类强转；类代理受 final / private 等边界影响。。增强顺序与匹配条件需观察实际链，而不是根据注解排列猜测。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">AOP：外部调用与自调用的边界</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">普通 Spring 代理模型；不包含 AspectJ 编织</text><rect x="30" y="155" width="300" height="135" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="188" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">调用方</text><text x="50" y="219" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">持有容器暴露的代理</text><text x="50" y="246" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">调用公开业务入口</text><rect x="410" y="155" width="300" height="135" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="430" y="188" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">代理与拦截链</text><text x="430" y="219" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">匹配 Advisor / Method</text><text x="430" y="246" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">事务、权限、异步等增强</text><rect x="790" y="155" width="300" height="135" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="188" font-size="22" fill="#247555" font-weight="650" text-anchor="start">目标对象 target</text><text x="810" y="219" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">执行真实方法 a</text><text x="810" y="246" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">this.b() 是目标内调用</text><path d="M330 222 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 222 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="410" y="380" width="680" height="115" rx="13" fill="#fff0f1" stroke="#a44654" stroke-width="2"/><text x="430" y="413" font-size="22" fill="#a44654" font-weight="650" text-anchor="start">自调用不会重新穿过外部代理入口</text><text x="430" y="444" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">a → this.b：不能只凭 b 上有注解就认定增强执行</text><path d="M940 290 V368" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="380" width="300" height="115" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="50" y="413" font-size="22" fill="#946215" font-weight="650" text-anchor="start">两类代理</text><text x="50" y="444" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">JDK：接口</text><text x="50" y="471" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">CGLIB：可覆盖方法</text><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">JDK 代理不能当目标实现类强转；类代理受 final / private 等边界影响。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">增强顺序与匹配条件需观察实际链，而不是根据注解排列猜测。</text></g></svg>
