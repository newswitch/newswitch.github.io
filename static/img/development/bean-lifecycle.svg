<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">普通受管 Bean：创建、增强与销毁</title><desc id="desc">简化主线；扩展处理器可介入更早阶段，Scope 影响管理边界。初始化通常针对目标对象，不能假定此时自调用已经过最终代理。。singleton 只定义共享范围，不保证字段和方法线程安全。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">普通受管 Bean：创建、增强与销毁</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">简化主线；扩展处理器可介入更早阶段，Scope 影响管理边界</text><rect x="30" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">实例化</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">构造器 / 工厂方法</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">得到原始对象</text><rect x="410" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">填充依赖</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">解析并注入协作对象</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">对象尚未必可对外使用</text><rect x="790" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">初始化前处理</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">Aware / 后置处理器</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">PostConstruct 等各有位置</text><rect x="790" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">初始化回调</text><text x="810" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">afterPropertiesSet</text><text x="810" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">自定义 initMethod</text><rect x="410" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="430" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">初始化后与使用</text><text x="430" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">后置处理可能返回代理</text><text x="430" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">外部使用容器暴露对象</text><rect x="30" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="50" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">关闭与销毁</text><text x="50" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">停止工作、销毁回调</text><text x="50" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">prototype 需自行管理清理</text><path d="M330 210 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 210 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M940 275 V348" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M790 425 H722" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M410 425 H342" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">初始化通常针对目标对象，不能假定此时自调用已经过最终代理。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">singleton 只定义共享范围，不保证字段和方法线程安全。</text></g></svg>
