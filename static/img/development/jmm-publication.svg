<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">happens-before：发布数据的可见性链</title><desc id="desc">语义顺序图；不是 CPU 缓存刷新或机器指令图。只靠等待一段时间不建立 happens-before；必须有规定的同步关系。。volatile 不把 count++ 的读、改、写整体变成原子操作。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">happens-before：发布数据的可见性链</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">语义顺序图；不是 CPU 缓存刷新或机器指令图</text><rect x="30" y="145" width="490" height="120" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">生产者：普通写</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">data = 42</text><rect x="600" y="145" width="490" height="120" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="620" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">生产者：volatile 写</text><text x="620" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">ready = true</text><rect x="600" y="370" width="490" height="120" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="620" y="403" font-size="22" fill="#247555" font-weight="650" text-anchor="start">消费者：volatile 读</text><text x="620" y="434" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">读到相应发布后的 ready = true</text><rect x="30" y="370" width="490" height="120" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="50" y="403" font-size="22" fill="#247555" font-weight="650" text-anchor="start">消费者：普通读</text><text x="50" y="434" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">读取 data，受传递关系约束</text><path d="M520 205 H588" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M845 265 V358" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M600 430 H532" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><text x="860" y="316" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">同步关系</text><text x="230" y="315" font-size="19" fill="#21364a" font-weight="400" text-anchor="start">同线程顺序 + 同步关系可传递</text><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">只靠等待一段时间不建立 happens-before；必须有规定的同步关系。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">volatile 不把 count++ 的读、改、写整体变成原子操作。</text></g></svg>
