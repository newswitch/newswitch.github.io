<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">参数按值传递：复制引用，不是复制对象</title><desc id="desc">逻辑关系示意；不是 JVM 对象的实际地址布局。基本类型同样复制值；对象可能共享，但 Java 不按引用传递参数。。方法返回后，局部引用消失不意味着对象立即被回收。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">参数按值传递：复制引用，不是复制对象</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">逻辑关系示意；不是 JVM 对象的实际地址布局</text><rect x="35" y="140" width="450" height="135" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="55" y="173" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">调用者 main 的栈帧</text><text x="55" y="204" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">变量 a 持有引用值 R</text><text x="55" y="231" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">调用 mutate(a)：复制 R</text><rect x="635" y="140" width="450" height="135" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="655" y="173" font-size="22" fill="#247555" font-weight="650" text-anchor="start">被调用方法的栈帧</text><text x="655" y="204" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">形参 p 得到同一引用值 R</text><text x="655" y="231" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">p = new ... 只改形参 p</text><rect x="270" y="380" width="580" height="120" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="290" y="413" font-size="22" fill="#946215" font-weight="650" text-anchor="start">共享对象</text><text x="290" y="444" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">a 与原来的 p 都可访问其字段</text><text x="290" y="471" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">修改对象 ≠ 替换调用者变量</text><path d="M260 275 V330 H400 V368" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M860 275 V330 H720 V368" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><text x="485" y="318" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">两个引用可指向同一对象</text><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">基本类型同样复制值；对象可能共享，但 Java 不按引用传递参数。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">方法返回后，局部引用消失不意味着对象立即被回收。</text></g></svg>
