<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">同步 JDBC 事务：代理、线程与连接</title><desc id="desc">DataSourceTransactionManager 主线，不套用于响应式或分布式事务。一个代理方法返回成功，仍需考虑提交阶段是否失败。。事务中等待远端 HTTP 会拉长连接持有；外部副作用不随本地自动回滚。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">同步 JDBC 事务：代理、线程与连接</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">DataSourceTransactionManager 主线，不套用于响应式或分布式事务</text><rect x="30" y="145" width="300" height="145" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">事务拦截器</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">解析传播与回滚规则</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">开启 / 加入 / 挂起事务</text><rect x="410" y="145" width="300" height="145" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">当前线程资源绑定</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">按 DataSource 找连接资源</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不等于全局共享连接</text><rect x="790" y="145" width="300" height="145" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#247555" font-weight="650" text-anchor="start">JdbcTemplate / JDBC</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">取得协作事务连接</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">执行 SQL 与映射</text><path d="M330 217 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 217 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="390" width="490" height="115" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="50" y="423" font-size="22" fill="#946215" font-weight="650" text-anchor="start">事务完成</text><text x="50" y="454" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">按状态提交 / 回滚并清理</text><text x="50" y="481" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">解除绑定、恢复与归还连接</text><rect x="600" y="390" width="490" height="115" rx="13" fill="#fff0f1" stroke="#a44654" stroke-width="2"/><text x="620" y="423" font-size="22" fill="#a44654" font-weight="650" text-anchor="start">新线程 / REQUIRES_NEW</text><text x="620" y="454" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">新线程不自动继承该事务</text><text x="620" y="481" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">新事务可能需要额外连接</text><path d="M940 290 V335 H275 V378" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">一个代理方法返回成功，仍需考虑提交阶段是否失败。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">事务中等待远端 HTTP 会拉长连接持有；外部副作用不随本地自动回滚。</text></g></svg>
