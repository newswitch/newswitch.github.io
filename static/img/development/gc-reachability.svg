<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">GC Roots 与对象保留链</title><desc id="desc">只画普通强引用关系；弱、软、虚引用另有处理规则。不可达不表示当场回收；回收取决于算法、阶段和其他规则。。诊断泄漏要看从根到对象的保留路径，不只看谁的对象数量最多。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">GC Roots 与对象保留链</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">只画普通强引用关系；弱、软、虚引用另有处理规则</text><rect x="30" y="145" width="240" height="120" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">GC Root 示例</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">活动线程中的引用</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">或相应静态引用</text><rect x="320" y="145" width="240" height="120" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="340" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">服务对象</text><text x="340" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">持有 cache 字段</text><rect x="610" y="145" width="240" height="120" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="630" y="178" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">缓存对象</text><text x="630" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">持有 entries</text><rect x="900" y="145" width="190" height="120" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="920" y="178" font-size="22" fill="#247555" font-weight="650" text-anchor="start">数据对象</text><text x="920" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">仍强可达</text><path d="M270 205 H308" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M560 205 H598" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M850 205 H888" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="320" y="380" width="300" height="120" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="340" y="413" font-size="22" fill="#946215" font-weight="650" text-anchor="start">对象 A</text><text x="340" y="444" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">仅与 B 相互引用</text><rect x="790" y="380" width="300" height="120" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="810" y="413" font-size="22" fill="#946215" font-weight="650" text-anchor="start">对象 B</text><text x="810" y="444" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">没有来自 Root 的路径</text><path d="M620 415 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M790 465 H632" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><text x="35" y="345" font-size="20" fill="#21364a" font-weight="400" text-anchor="start">下方环没有根路径：存在互相引用，也可能整体不可达。</text><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">不可达不表示当场回收；回收取决于算法、阶段和其他规则。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">诊断泄漏要看从根到对象的保留路径，不只看谁的对象数量最多。</text></g></svg>
