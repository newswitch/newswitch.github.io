<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">异常与资源关闭：主异常和 suppressed</title><desc id="desc">try-with-resources 的简化规则，关闭次序为创建次序的反向。资源实现必须正确遵守关闭协议；不代表所有外部动作都能撤销。。捕获并吞掉异常会改变上层观察，日志应保留主因和 suppressed 链。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">异常与资源关闭：主异常和 suppressed</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">try-with-resources 的简化规则，关闭次序为创建次序的反向</text><rect x="30" y="145" width="300" height="135" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">创建资源 A、B</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">从左到右初始化</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">后续创建失败也需清理前者</text><rect x="410" y="145" width="300" height="135" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">执行 body</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">可能正常返回</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">也可能抛出主异常</text><rect x="790" y="145" width="300" height="135" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#247555" font-weight="650" text-anchor="start">关闭 B，再关闭 A</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">退出块时执行 close</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">正常与异常退出均需考虑</text><path d="M330 212 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 212 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="390" width="490" height="120" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="50" y="423" font-size="22" fill="#946215" font-weight="650" text-anchor="start">body 已抛异常</text><text x="50" y="454" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">close 再失败通常成为 suppressed</text><text x="50" y="481" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">保留原始主异常用于诊断</text><rect x="600" y="390" width="490" height="120" rx="13" fill="#fff0f1" stroke="#a44654" stroke-width="2"/><text x="620" y="423" font-size="22" fill="#a44654" font-weight="650" text-anchor="start">body 正常，close 失败</text><text x="620" y="454" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">关闭异常可成为最终抛出异常</text><text x="620" y="481" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不要在 finally 中随意 return 覆盖结果</text><path d="M940 280 V330 H275 V378" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1010 280 V378" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">资源实现必须正确遵守关闭协议；不代表所有外部动作都能撤销。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">捕获并吞掉异常会改变上层观察，日志应保留主因和 suppressed 链。</text></g></svg>
