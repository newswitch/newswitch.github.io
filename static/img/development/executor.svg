<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">线程池：接收、排队、扩展与拒绝</title><desc id="desc">ThreadPoolExecutor 的简化提交主线，不代表所有执行器。图中不是“必定填满 max 后再排队”；队列类型会影响实际线程增长。。停机先停止接收，再有限等待；虚拟线程也不增加下游资源上限。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">线程池：接收、排队、扩展与拒绝</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">ThreadPoolExecutor 的简化提交主线，不代表所有执行器</text><rect x="30" y="145" width="300" height="125" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">提交任务</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">先按核心线程规则接收</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不足时尝试建工作线程</text><rect x="410" y="145" width="300" height="125" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">有界队列</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">核心线程忙时尝试入队</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">队列也占内存</text><rect x="790" y="145" width="300" height="125" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#247555" font-weight="650" text-anchor="start">尝试扩展到 max</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">队列无法接收时</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">再尝试创建额外线程</text><path d="M330 207 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 207 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="365" width="490" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="50" y="398" font-size="22" fill="#247555" font-weight="650" text-anchor="start">执行与完成</text><text x="50" y="429" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">观察结果、异常和取消</text><text x="50" y="456" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">finally 释放资源与上下文</text><rect x="600" y="365" width="490" height="130" rx="13" fill="#fff0f1" stroke="#a44654" stroke-width="2"/><text x="620" y="398" font-size="22" fill="#a44654" font-weight="650" text-anchor="start">无法接收 → 拒绝策略</text><text x="620" y="429" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">Abort / CallerRuns 等有不同语义</text><text x="620" y="456" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">CallerRuns 会占用提交者线程</text><path d="M940 270 V353" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><text x="953" y="320" font-size="17" fill="#21364a" font-weight="400" text-anchor="start">无法扩展</text><path d="M560 270 V325 H275 V353" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><text x="350" y="315" font-size="17" fill="#21364a" font-weight="400" text-anchor="start">已接收的任务</text><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">图中不是“必定填满 max 后再排队”；队列类型会影响实际线程增长。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">停机先停止接收，再有限等待；虚拟线程也不增加下游资源上限。</text></g></svg>
