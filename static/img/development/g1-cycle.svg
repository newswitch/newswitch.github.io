<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">G1：Region、并发标记与回收集合</title><desc id="desc">简化的一条工作主线，不是所有 GC 事件都必须按图连续出现。并发不等于无暂停；GC 后堆占用下降也不保证 RSS 立即下降。。暂停目标不是硬实时承诺，负载、CPU、存活集和空间都会影响结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">G1：Region、并发标记与回收集合</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">简化的一条工作主线，不是所有 GC 事件都必须按图连续出现</text><rect x="30" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">对象分配</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">通常先进入 Eden Region</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">大对象等有不同路径</text><rect x="410" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">Young evacuation</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">暂停并复制存活对象</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">更新引用、释放相应 Region</text><rect x="790" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">并发标记启动</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">借助相应暂停建立起点</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">与应用并发追踪可达性</text><rect x="790" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">Remark / Cleanup</text><text x="810" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">处理标记收尾等工作</text><text x="810" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">部分阶段仍需要暂停</text><rect x="410" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="430" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">选择回收集合</text><text x="430" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">根据存活与收益等选择</text><text x="430" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">Mixed 可含部分老年代</text><rect x="30" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="50" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">后续 evacuation</text><text x="50" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">暂停复制并修正引用</text><text x="50" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">仍可能发生退化或 Full GC</text><path d="M330 210 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 210 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M940 275 V348" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M790 425 H722" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M410 425 H342" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">并发不等于无暂停；GC 后堆占用下降也不保证 RSS 立即下降。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">暂停目标不是硬实时承诺，负载、CPU、存活集和空间都会影响结果。</text></g></svg>
