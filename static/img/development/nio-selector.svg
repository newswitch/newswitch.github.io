<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">NIO：就绪通知、缓冲与实际处理</title><desc id="desc">非阻塞 SocketChannel 的简化关系；就绪不等于整个请求完成。read 可能只得到部分数据、返回 0 或结束；必须按返回值推进状态。。非阻塞 IO 不等于业务代码不会阻塞，也不保证自动背压。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">NIO：就绪通知、缓冲与实际处理</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">非阻塞 SocketChannel 的简化关系；就绪不等于整个请求完成</text><rect x="30" y="150" width="300" height="140" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="183" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">Selector</text><text x="50" y="214" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">监听注册事件</text><text x="50" y="241" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">选出可能可读 / 可写的键</text><rect x="410" y="150" width="300" height="140" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="430" y="183" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">事件循环</text><text x="430" y="214" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">读取 / 写入 Channel</text><text x="430" y="241" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">推进 ByteBuffer 状态</text><rect x="790" y="150" width="300" height="140" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="183" font-size="22" fill="#247555" font-weight="650" text-anchor="start">协议与业务</text><text x="810" y="214" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">半包 / 粘包解析</text><text x="810" y="241" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">耗时工作移出事件循环</text><path d="M330 220 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 220 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="390" width="490" height="115" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="50" y="423" font-size="22" fill="#946215" font-weight="650" text-anchor="start">Buffer：position / limit / capacity</text><text x="50" y="454" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">写入后 flip 切读，消费后 compact 或 clear</text><text x="50" y="481" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">缓冲区也有资源和状态边界</text><rect x="600" y="390" width="490" height="115" rx="13" fill="#fff0f1" stroke="#a44654" stroke-width="2"/><text x="620" y="423" font-size="22" fill="#a44654" font-weight="650" text-anchor="start">写就绪不表示必须永远监听 OP_WRITE</text><text x="620" y="454" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">只在有待写数据时关注相应事件</text><text x="620" y="481" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">避免忙循环和无限积压</text><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">read 可能只得到部分数据、返回 0 或结束；必须按返回值推进状态。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">非阻塞 IO 不等于业务代码不会阻塞，也不保证自动背压。</text></g></svg>
