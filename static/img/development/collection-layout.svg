<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">ArrayList 与 LinkedList：引用布局和访问路径</title><desc id="desc">逻辑结构示意；不按真实对象地址、大小或缓存行绘制。LinkedList 插入不是“按任意索引总是 O(1)”：必须先定位。。ArrayList 中间插入会移动引用；容量、扩容与遍历成本需一起比较。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">ArrayList 与 LinkedList：引用布局和访问路径</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">逻辑结构示意；不按真实对象地址、大小或缓存行绘制</text><rect x="30" y="145" width="300" height="125" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">ArrayList</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">索引 → 引用数组位置</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">随机访问直接定位</text><rect x="410" y="145" width="680" height="125" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#247555" font-weight="650" text-anchor="start">一个数组保存多个元素引用</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">槽位：ref0   ref1   ref2   ref3</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">元素对象本身不一定连续</text><path d="M330 207 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="365" width="300" height="125" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="50" y="398" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">LinkedList</text><text x="50" y="429" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">首尾与节点链</text><text x="50" y="456" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">按索引需要沿链查找</text><rect x="410" y="365" width="300" height="125" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="430" y="398" font-size="22" fill="#946215" font-weight="650" text-anchor="start">节点 A</text><text x="430" y="429" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">prev / item / next</text><text x="430" y="456" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">每节点有额外开销</text><rect x="790" y="365" width="300" height="125" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="810" y="398" font-size="22" fill="#946215" font-weight="650" text-anchor="start">节点 B</text><text x="810" y="429" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">prev / item / next</text><text x="810" y="456" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">定位后局部接链</text><path d="M330 427 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 407 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M790 457 H722" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">LinkedList 插入不是“按任意索引总是 O(1)”：必须先定位。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">ArrayList 中间插入会移动引用；容量、扩容与遍历成本需一起比较。</text></g></svg>
