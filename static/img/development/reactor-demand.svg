<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">Reactor：订阅、需求、数据与取消</title><desc id="desc">信号方向图；Scheduler 切换不会自动增加下游容量。背压约束需求，不等于所有外部生产者都可无限暂停。。看到响应式返回类型，不代表内部没有阻塞、无限队列或资源泄漏。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">Reactor：订阅、需求、数据与取消</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">信号方向图；Scheduler 切换不会自动增加下游容量</text><rect x="30" y="170" width="300" height="150" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="203" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">Publisher / 上游</text><text x="50" y="234" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">按协议发 onNext</text><text x="50" y="261" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">最终完成或错误</text><rect x="410" y="170" width="300" height="150" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="430" y="203" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">操作符链</text><text x="430" y="234" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">map / flatMap / buffer 等</text><text x="430" y="261" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">可能有预取与内部队列</text><rect x="790" y="170" width="300" height="150" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="203" font-size="22" fill="#247555" font-weight="650" text-anchor="start">Subscriber / 下游</text><text x="810" y="234" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">消费数据</text><text x="810" y="261" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">控制需求与取消</text><path d="M330 205 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 205 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M790 285 H722" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M410 285 H342" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><text x="357" y="365" font-size="20" fill="#21364a" font-weight="400" text-anchor="start">上：数据信号 →    下：request(n) / cancel ←</text><rect x="30" y="420" width="1060" height="95" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="50" y="453" font-size="22" fill="#946215" font-weight="650" text-anchor="start">线程与资源另行管理</text><text x="50" y="484" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">阻塞工作选择合适执行位置；取消应传播并释放连接、缓冲和后台工作。</text><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">背压约束需求，不等于所有外部生产者都可无限暂停。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">看到响应式返回类型，不代表内部没有阻塞、无限队列或资源泄漏。</text></g></svg>
