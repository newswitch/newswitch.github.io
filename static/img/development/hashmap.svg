<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">HashMap：桶定位与桶内查找</title><desc id="desc">OpenJDK 常见实现关系；不按真实对象大小绘制。树化受表容量、桶长度和插入路径影响，不是“碰撞 8 次必定树化”。。LinkedHashMap 额外维护顺序；HashSet 在相应实现中复用哈希映射。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">HashMap：桶定位与桶内查找</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">OpenJDK 常见实现关系；不按真实对象大小绘制</text><rect x="30" y="140" width="300" height="140" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="173" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">输入 key</text><text x="50" y="204" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">hashCode / 扰动</text><text x="50" y="231" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">定位桶，再比较 key</text><rect x="410" y="140" width="300" height="140" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="430" y="173" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">桶数组 table</text><text x="430" y="204" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">capacity 是桶数量</text><text x="430" y="231" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">size 是键值对数量</text><rect x="790" y="140" width="300" height="140" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="173" font-size="22" fill="#247555" font-weight="650" text-anchor="start">桶内结构</text><text x="810" y="204" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">节点链 / 合适时树化</text><text x="810" y="231" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">哈希 + 身份 / equals</text><path d="M330 210 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 210 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="365" width="490" height="130" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="50" y="398" font-size="22" fill="#946215" font-weight="650" text-anchor="start">扩容</text><text x="50" y="429" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">达到相应阈值后扩大桶数组</text><text x="50" y="456" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">重新分布节点，产生分配与迁移成本</text><rect x="600" y="365" width="490" height="130" rx="13" fill="#fff0f1" stroke="#a44654" stroke-width="2"/><text x="620" y="398" font-size="22" fill="#a44654" font-weight="650" text-anchor="start">键的契约</text><text x="620" y="429" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">相等对象必须具有相同 hashCode</text><text x="620" y="456" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">入表后别改变参与比较的状态</text><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">树化受表容量、桶长度和插入路径影响，不是“碰撞 8 次必定树化”。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">LinkedHashMap 额外维护顺序；HashSet 在相应实现中复用哈希映射。</text></g></svg>
