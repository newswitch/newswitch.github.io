<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">Maven：版本、可见性、任务与产物</title><desc id="desc">四个维度分开，不把 BOM、Scope、插件与可执行 JAR 混为一谈。导入 BOM 不会自动引入里面全部依赖，也不会自动执行所有插件。。IDE 能运行不等于打出的 JAR 可独立运行，需验证产物和运行 classpath。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">Maven：版本、可见性、任务与产物</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">四个维度分开，不把 BOM、Scope、插件与可执行 JAR 混为一谈</text><rect x="30" y="145" width="490" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">依赖声明与版本管理</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">dependencies：真正引入依赖</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">dependencyManagement / BOM：管理版本</text><rect x="600" y="145" width="490" height="130" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="620" y="178" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">Scope 与依赖图</text><text x="620" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">compile / runtime / test 等影响可见范围</text><text x="620" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">传递、冲突仲裁与排除需检查实际树</text><rect x="30" y="365" width="490" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="50" y="398" font-size="22" fill="#247555" font-weight="650" text-anchor="start">生命周期与插件</text><text x="50" y="429" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">compile / test / package / verify</text><text x="50" y="456" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">插件 goal 执行具体构建工作</text><rect x="600" y="365" width="490" height="130" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="620" y="398" font-size="22" fill="#946215" font-weight="650" text-anchor="start">最终产物</text><text x="620" y="429" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">普通库、分发包、Boot 可执行 JAR</text><text x="620" y="456" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">构建成功后仍需检查布局与实际运行</text><path d="M275 275 V353" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M845 275 V325 H560 V430 H588" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M520 430 H588" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">导入 BOM 不会自动引入里面全部依赖，也不会自动执行所有插件。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">IDE 能运行不等于打出的 JAR 可独立运行，需验证产物和运行 classpath。</text></g></svg>
