<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">JVM 进程内存：堆不是全部</title><desc id="desc">逻辑区域与观测口径分开；面积不表示容量。reserved、committed、used、RSS 不可直接画等号或机械相减对账。。容器上限必须给堆、非堆、线程与运行余量共同留空间。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">JVM 进程内存：堆不是全部</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">逻辑区域与观测口径分开；面积不表示容量</text><rect x="30" y="140" width="330" height="140" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="173" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">Java Heap（堆）</text><text x="50" y="204" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">对象、数组、部分栈块</text><text x="50" y="231" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">GC 后存活量 / heap dump</text><rect x="395" y="140" width="330" height="140" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="415" y="173" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">类与机器码</text><text x="415" y="204" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">Metaspace / Class Space</text><text x="415" y="231" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">Code Cache / JIT</text><rect x="760" y="140" width="330" height="140" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="780" y="173" font-size="22" fill="#247555" font-weight="650" text-anchor="start">平台线程栈</text><text x="780" y="204" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">调用帧与本地执行状态</text><text x="780" y="231" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">线程数与 Xss 影响预算</text><rect x="30" y="330" width="330" height="140" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="50" y="363" font-size="22" fill="#946215" font-weight="650" text-anchor="start">Direct / Native</text><text x="50" y="394" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">直接缓冲、JNI、本地库</text><text x="50" y="421" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不都受 Xmx 约束</text><rect x="395" y="330" width="330" height="140" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="415" y="363" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">其他进程区域</text><text x="415" y="394" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">共享库、映射、JVM 自身</text><text x="415" y="421" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不同工具覆盖范围不同</text><rect x="760" y="330" width="330" height="140" rx="13" fill="#fff0f1" stroke="#a44654" stroke-width="2"/><text x="780" y="363" font-size="22" fill="#a44654" font-weight="650" text-anchor="start">OS / cgroup 口径</text><text x="780" y="394" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">RSS：驻留物理页</text><text x="780" y="421" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">容器统计还可能含缓存</text><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">reserved、committed、used、RSS 不可直接画等号或机械相减对账。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">容器上限必须给堆、非堆、线程与运行余量共同留空间。</text></g></svg>
