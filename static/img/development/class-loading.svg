<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">Class：加载、链接、初始化与使用</title><desc id="desc">委派模型和初始化触发是两条不同问题，不能只看类文件存在。链接包括验证、准备、解析；解析与其他阶段的具体时机需区分。。相同类名来自不同定义加载器时，不能假定可互相强转。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">Class：加载、链接、初始化与使用</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">委派模型和初始化触发是两条不同问题，不能只看类文件存在</text><rect x="30" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">加载请求</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">先看已加载状态</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">按加载器策略寻找类型</text><rect x="410" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">父委派 / 定义</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">常见模型先委派父加载器</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不是所有加载器都同一策略</text><rect x="790" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">验证</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">检查字节码等约束</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不是执行业务代码</text><rect x="790" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">准备与解析</text><text x="810" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">分配类变量等准备</text><text x="810" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">解析可按实现延迟</text><rect x="410" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="430" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">初始化</text><text x="430" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">按规则执行类初始化</text><text x="430" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不是每次引用都触发</text><rect x="30" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="50" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">使用类型</text><text x="50" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">类名 + 定义加载器</text><text x="50" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">共同参与类型身份</text><path d="M330 210 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 210 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M940 275 V348" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M790 425 H722" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M410 425 H342" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">链接包括验证、准备、解析；解析与其他阶段的具体时机需区分。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">相同类名来自不同定义加载器时，不能假定可互相强转。</text></g></svg>
