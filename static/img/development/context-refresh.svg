<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">ApplicationContext refresh：定义与实例分开</title><desc id="desc">容器刷新简化主线；失败清理和扩展点顺序同样重要。定义后处理不是“对每个实例做初始化”；两类处理器作用对象不同。。构造成功、刷新成功与 Boot readiness 是不同状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">ApplicationContext refresh：定义与实例分开</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">容器刷新简化主线；失败清理和扩展点顺序同样重要</text><rect x="30" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">准备环境与工厂</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">建立本次刷新所需状态</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">读取与注册初始定义</text><rect x="410" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">定义工厂后处理</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">注册更多定义、修改元数据</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">BeanFactoryPostProcessor</text><rect x="790" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">注册实例后处理器</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">为后续 Bean 创建准备拦截</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">BeanPostProcessor</text><rect x="790" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">初始化容器设施</text><text x="810" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">事件、多语言、Web 等</text><text x="810" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">取决于上下文类型</text><rect x="410" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="430" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">实例化相应单例</text><text x="430" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">依赖解析、初始化、代理</text><text x="430" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">不是所有 lazy / scope 都创建</text><rect x="30" y="360" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="50" y="393" font-size="22" fill="#247555" font-weight="650" text-anchor="start">完成或失败</text><text x="50" y="424" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">成功发布相应事件</text><text x="50" y="451" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">失败销毁已建单例并清理</text><path d="M330 210 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 210 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M940 275 V348" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M790 425 H722" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M410 425 H342" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">定义后处理不是“对每个实例做初始化”；两类处理器作用对象不同。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">构造成功、刷新成功与 Boot readiness 是不同状态。</text></g></svg>
