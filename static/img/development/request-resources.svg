<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc"><title id="title">一次请求：线程、连接与依赖是不同资源</title><desc id="desc">不同等待点拥有自己的上限、超时和取消；CPU 低也可能已饱和。资源关系不表示所有请求同时使用全部依赖，也不表示所有耗时能直接相加。。先找等待与占用边界，再决定限流、缩事务、调池或扩容。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587185"/></marker></defs><rect width="1120" height="660" rx="16" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1120" height="102" rx="16" fill="#152e43"/><rect y="80" width="1120" height="22" fill="#152e43"/><text x="30" y="43" font-size="28" fill="#fff" font-weight="700" text-anchor="start">一次请求：线程、连接与依赖是不同资源</text><text x="30" y="77" font-size="17" fill="#d6e4ee" font-weight="400" text-anchor="start">不同等待点拥有自己的上限、超时和取消；CPU 低也可能已饱和</text><rect x="30" y="145" width="300" height="130" rx="13" fill="#eef5ff" stroke="#32659b" stroke-width="2"/><text x="50" y="178" font-size="22" fill="#32659b" font-weight="650" text-anchor="start">入口与请求处理</text><text x="50" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">连接、队列、Servlet / 虚拟线程</text><text x="50" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">入口 deadline</text><rect x="410" y="145" width="300" height="130" rx="13" fill="#f3effb" stroke="#6b5296" stroke-width="2"/><text x="430" y="178" font-size="22" fill="#6b5296" font-weight="650" text-anchor="start">业务执行</text><text x="430" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">CPU、锁与有界任务池</text><text x="430" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">状态、权限与事务</text><rect x="790" y="145" width="300" height="130" rx="13" fill="#edf8f2" stroke="#247555" stroke-width="2"/><text x="810" y="178" font-size="22" fill="#247555" font-weight="650" text-anchor="start">返回客户端</text><text x="810" y="209" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">序列化、缓冲、网络写出</text><text x="810" y="236" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">慢消费者与断连</text><path d="M330 210 H398" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M710 210 H778" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="390" width="300" height="120" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="50" y="423" font-size="22" fill="#946215" font-weight="650" text-anchor="start">数据库池</text><text x="50" y="454" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">租借 / SQL / 锁 / 提交</text><text x="50" y="481" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">有独立等待</text><rect x="410" y="390" width="300" height="120" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="430" y="423" font-size="22" fill="#946215" font-weight="650" text-anchor="start">HTTP / 消息客户端</text><text x="430" y="454" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">建连 / 流 / 确认 / 重试</text><text x="430" y="481" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">需要独立资源预算</text><rect x="790" y="390" width="300" height="120" rx="13" fill="#fff7e7" stroke="#946215" stroke-width="2"/><text x="810" y="423" font-size="22" fill="#946215" font-weight="650" text-anchor="start">缓存与内存</text><text x="810" y="454" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">队列、缓存、上下文</text><text x="810" y="481" font-size="18" fill="#21364a" font-weight="400" text-anchor="start">有容量与生命周期</text><path d="M465 275 V330 H180 V378" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M560 275 V378" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M655 275 V330 H940 V378" fill="none" stroke="#587185" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 582 H1090" stroke="#dde5eb"/><text x="30" y="602" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">资源关系不表示所有请求同时使用全部依赖，也不表示所有耗时能直接相加。</text><text x="30" y="627" font-size="17" fill="#455c70" font-weight="400" text-anchor="start">先找等待与占用边界，再决定限流、缩事务、调池或扩容。</text></g></svg>
