<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker><style>.t{font-family:Inter,'Microsoft YaHei',sans-serif;fill:#102a43}.h{font-size:34px;font-weight:700}.b{font-size:22px;font-weight:700}.s{font-size:18px;fill:#486581}.x{rx:16;stroke:#94a3b8;stroke-width:2}.tls{stroke:#16a34a;stroke-width:5;marker-start:url(#g);marker-end:url(#g)}.plain{stroke:#dc2626;stroke-width:5;marker-start:url(#r);marker-end:url(#r)}</style></defs>
  <rect width="1440" height="900" fill="#f8fafc"/><rect x="35" y="30" width="1370" height="75" rx="18" fill="#102a43"/><text x="70" y="79" class="t h" fill="#fff">TLS 部署模式：先找终止点，再判断明文边界</text>
  <g transform="translate(0 135)"><text x="65" y="55" class="t b">① TLS 终止</text><rect x="220" y="15" width="210" height="75" class="x" fill="#dbeafe"/><text x="325" y="60" text-anchor="middle" class="t b">Client</text><rect x="610" y="15" width="230" height="75" class="x" fill="#fef3c7"/><text x="725" y="60" text-anchor="middle" class="t b">Gateway 🔑</text><rect x="1030" y="15" width="230" height="75" class="x" fill="#dcfce7"/><text x="1145" y="60" text-anchor="middle" class="t b">Backend</text><line x1="430" y1="52" x2="610" y2="52" class="tls"/><text x="520" y="35" text-anchor="middle" class="t s">TLS A</text><line x1="840" y1="52" x2="1030" y2="52" class="plain"/><text x="935" y="35" text-anchor="middle" class="t s">HTTP 明文</text></g>
  <g transform="translate(0 315)"><text x="65" y="55" class="t b">② 重新加密</text><rect x="220" y="15" width="210" height="75" class="x" fill="#dbeafe"/><text x="325" y="60" text-anchor="middle" class="t b">Client</text><rect x="610" y="15" width="230" height="75" class="x" fill="#fef3c7"/><text x="725" y="60" text-anchor="middle" class="t b">Gateway 🔑</text><rect x="1030" y="15" width="230" height="75" class="x" fill="#dcfce7"/><text x="1145" y="60" text-anchor="middle" class="t b">Backend 🔑</text><line x1="430" y1="52" x2="610" y2="52" class="tls"/><text x="520" y="35" text-anchor="middle" class="t s">TLS A</text><line x1="840" y1="52" x2="1030" y2="52" class="tls"/><text x="935" y="35" text-anchor="middle" class="t s">TLS B</text></g>
  <g transform="translate(0 495)"><text x="65" y="55" class="t b">③ TLS 透传</text><rect x="220" y="15" width="210" height="75" class="x" fill="#dbeafe"/><text x="325" y="60" text-anchor="middle" class="t b">Client</text><rect x="610" y="15" width="230" height="75" class="x" fill="#fef3c7"/><text x="725" y="60" text-anchor="middle" class="t b">L4 Gateway</text><rect x="1030" y="15" width="230" height="75" class="x" fill="#dcfce7"/><text x="1145" y="60" text-anchor="middle" class="t b">Backend 🔑</text><line x1="430" y1="52" x2="1030" y2="52" class="tls"/><text x="725" y="35" text-anchor="middle" class="t s">同一条 TLS 会话穿过转发设备</text></g>
  <g transform="translate(0 675)"><text x="65" y="55" class="t b">④ 双向 TLS</text><rect x="220" y="15" width="210" height="75" class="x" fill="#dbeafe"/><text x="325" y="48" text-anchor="middle" class="t b">Client 🔑</text><text x="325" y="73" text-anchor="middle" class="t s">客户端证书</text><rect x="610" y="15" width="230" height="75" class="x" fill="#dcfce7"/><text x="725" y="48" text-anchor="middle" class="t b">Server 🔑</text><text x="725" y="73" text-anchor="middle" class="t s">服务端证书</text><line x1="430" y1="52" x2="610" y2="52" class="tls"/><text x="1030" y="48" class="t b">双方验证证书与私钥持有</text><text x="1030" y="78" class="t s">认证成功后仍需业务授权</text></g>
</svg>
