<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><style>.t{font-family:Inter,'Microsoft YaHei',sans-serif;fill:#102a43}.h{font-size:34px;font-weight:700}.b{font-size:23px;font-weight:700}.s{font-size:18px;fill:#486581}.x{rx:16;stroke-width:2}.l{stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="800" fill="#f8fafc"/><rect x="35" y="30" width="1370" height="75" rx="18" fill="#102a43"/><text x="70" y="79" class="t h" fill="#fff">TLS 文件关系：对象、编码、容器与部署位置</text>
  <rect x="70" y="150" width="270" height="120" class="x" fill="#fee2e2" stroke="#dc2626"/><text x="205" y="195" text-anchor="middle" class="t b">server.key</text><text x="205" y="228" text-anchor="middle" class="t s">私钥 · 必须保密</text><text x="205" y="254" text-anchor="middle" class="t s">PEM/DER · 可加密</text>
  <line x1="340" y1="210" x2="545" y2="210" class="l"/><text x="442" y="190" text-anchor="middle" class="t s">提取公钥并签署申请</text>
  <rect x="545" y="150" width="280" height="120" class="x" fill="#fef3c7" stroke="#d97706"/><text x="685" y="195" text-anchor="middle" class="t b">server.csr</text><text x="685" y="228" text-anchor="middle" class="t s">公钥 + SAN 请求</text><text x="685" y="254" text-anchor="middle" class="t s">不是证书</text>
  <line x1="825" y1="210" x2="1020" y2="210" class="l"/><text x="922" y="190" text-anchor="middle" class="t s">CA 审核并签名</text>
  <rect x="1020" y="150" width="350" height="120" class="x" fill="#dcfce7" stroke="#16a34a"/><text x="1195" y="195" text-anchor="middle" class="t b">server.crt</text><text x="1195" y="228" text-anchor="middle" class="t s">叶子证书 · 可公开</text><text x="1195" y="254" text-anchor="middle" class="t s">包含公钥与身份声明</text>
  <rect x="70" y="350" width="350" height="130" class="x" fill="#dbeafe" stroke="#2563eb"/><text x="245" y="395" text-anchor="middle" class="t b">intermediate-ca.crt</text><text x="245" y="430" text-anchor="middle" class="t s">中间 CA 证书</text><text x="245" y="460" text-anchor="middle" class="t s">服务端随链发送</text>
  <line x1="420" y1="415" x2="610" y2="415" class="l"/><line x1="1195" y1="270" x2="880" y2="390" class="l"/>
  <rect x="610" y="350" width="310" height="130" class="x" fill="#ede9fe" stroke="#7c3aed"/><text x="765" y="395" text-anchor="middle" class="t b">fullchain.pem</text><text x="765" y="430" text-anchor="middle" class="t s">Leaf + Intermediate(s)</text><text x="765" y="460" text-anchor="middle" class="t s">通常不含 Root</text>
  <rect x="1020" y="350" width="350" height="130" class="x" fill="#ecfeff" stroke="#0891b2"/><text x="1195" y="395" text-anchor="middle" class="t b">root-ca.crt / CA Bundle</text><text x="1195" y="430" text-anchor="middle" class="t s">客户端 Trust Store</text><text x="1195" y="460" text-anchor="middle" class="t s">可信渠道分发</text>
  <rect x="70" y="570" width="1300" height="135" class="x" fill="#fff" stroke="#cbd5e1"/><text x="110" y="615" class="t b">扩展名不能决定内容</text><text x="110" y="655" class="t s">PEM = 文本编码边界；DER = 二进制编码；CRT/CER/KEY = 命名习惯；P12/PFX = 可同时包含私钥、叶子和证书链；JKS = Java 容器之一。</text><text x="110" y="686" class="t s">识别对象使用 openssl x509 / pkey / req / pkcs12，而不是只看文件名。</text>
</svg>
