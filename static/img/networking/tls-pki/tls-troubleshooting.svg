<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><style>.t{font-family:Inter,'Microsoft YaHei',sans-serif;fill:#102a43}.h{font-size:34px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:17px;fill:#486581}.x{rx:14;stroke-width:2}.l{stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="900" fill="#f8fafc"/><rect x="35" y="30" width="1370" height="75" rx="18" fill="#102a43"/><text x="70" y="79" class="t h" fill="#fff">TLS 故障排查：按最后成功层次收敛，而不是先换证书</text>
  <rect x="525" y="140" width="390" height="70" class="x" fill="#dbeafe" stroke="#2563eb"/><text x="720" y="183" text-anchor="middle" class="t b">HTTPS / mTLS 请求失败</text>
  <line x1="720" y1="210" x2="720" y2="250" class="l"/><rect x="525" y="255" width="390" height="80" class="x" fill="#fff" stroke="#94a3b8"/><text x="720" y="287" text-anchor="middle" class="t b">DNS 与目标地址正确？</text><text x="720" y="317" text-anchor="middle" class="t s">dig / resolvectl / --resolve</text>
  <line x1="525" y1="295" x2="300" y2="295" class="l"/><rect x="65" y="250" width="235" height="90" class="x" fill="#fee2e2" stroke="#dc2626"/><text x="182" y="285" text-anchor="middle" class="t b">否：DNS/入口</text><text x="182" y="315" text-anchor="middle" class="t s">A/AAAA、缓存、分流</text>
  <line x1="720" y1="335" x2="720" y2="375" class="l"/><rect x="525" y="380" width="390" height="80" class="x" fill="#fff" stroke="#94a3b8"/><text x="720" y="412" text-anchor="middle" class="t b">TCP/QUIC 建连成功？</text><text x="720" y="442" text-anchor="middle" class="t s">nc / ss / tcpdump / SYN-RST</text>
  <line x1="915" y1="420" x2="1135" y2="420" class="l"/><rect x="1135" y="375" width="240" height="90" class="x" fill="#fee2e2" stroke="#dc2626"/><text x="1255" y="410" text-anchor="middle" class="t b">否：网络/监听</text><text x="1255" y="440" text-anchor="middle" class="t s">路由、ACL、队列、端口</text>
  <line x1="720" y1="460" x2="720" y2="500" class="l"/><rect x="525" y="505" width="390" height="80" class="x" fill="#fff" stroke="#94a3b8"/><text x="720" y="537" text-anchor="middle" class="t b">ServerHello / Alert 返回？</text><text x="720" y="567" text-anchor="middle" class="t s">SNI、版本、Cipher、Group、签名</text>
  <line x1="525" y1="545" x2="300" y2="545" class="l"/><rect x="65" y="500" width="235" height="90" class="x" fill="#fef3c7" stroke="#d97706"/><text x="182" y="535" text-anchor="middle" class="t b">否：协商/代理</text><text x="182" y="565" text-anchor="middle" class="t s">ClientHello 与服务端日志</text>
  <line x1="720" y1="585" x2="720" y2="625" class="l"/><rect x="525" y="630" width="390" height="80" class="x" fill="#fff" stroke="#94a3b8"/><text x="720" y="662" text-anchor="middle" class="t b">证书验证与 mTLS 成功？</text><text x="720" y="692" text-anchor="middle" class="t s">链、SAN、时间、EKU、Client CA</text>
  <line x1="915" y1="670" x2="1135" y2="670" class="l"/><rect x="1135" y="625" width="240" height="90" class="x" fill="#fef3c7" stroke="#d97706"/><text x="1255" y="660" text-anchor="middle" class="t b">否：PKI/身份</text><text x="1255" y="690" text-anchor="middle" class="t s">验证实际链与 Trust Store</text>
  <line x1="720" y1="710" x2="720" y2="750" class="l"/><rect x="525" y="755" width="390" height="90" class="x" fill="#dcfce7" stroke="#16a34a"/><text x="720" y="790" text-anchor="middle" class="t b">TLS 已成功：转入 HTTP/应用</text><text x="720" y="820" text-anchor="middle" class="t s">ALPN、Host、Route、Auth、Upstream、TTFB</text>
</svg>
