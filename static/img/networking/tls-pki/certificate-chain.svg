<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><style>.t{font-family:Inter,'Microsoft YaHei',sans-serif;fill:#102a43}.h{font-size:34px;font-weight:700}.b{font-size:24px;font-weight:700}.s{font-size:19px;fill:#486581}.x{rx:18;stroke-width:2}.l{stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="760" fill="#f8fafc"/><rect x="35" y="30" width="1370" height="75" rx="18" fill="#102a43"/><text x="70" y="79" class="t h" fill="#fff">X.509 证书链：服务端发送链，客户端提供信任锚</text>
  <rect x="90" y="165" width="280" height="135" class="x" fill="#fef3c7" stroke="#d97706"/><text x="230" y="210" text-anchor="middle" class="t b">Root CA</text><text x="230" y="244" text-anchor="middle" class="t s">客户端 Trust Store</text><text x="230" y="274" text-anchor="middle" class="t s">私钥离线 / HSM</text>
  <line x1="370" y1="232" x2="540" y2="232" class="l"/><text x="455" y="215" text-anchor="middle" class="t s">签发</text>
  <rect x="540" y="165" width="320" height="135" class="x" fill="#dbeafe" stroke="#2563eb"/><text x="700" y="210" text-anchor="middle" class="t b">Intermediate CA</text><text x="700" y="244" text-anchor="middle" class="t s">CA:TRUE / keyCertSign</text><text x="700" y="274" text-anchor="middle" class="t s">日常受控签发</text>
  <line x1="860" y1="232" x2="1030" y2="232" class="l"/><text x="945" y="215" text-anchor="middle" class="t s">签发</text>
  <rect x="1030" y="165" width="320" height="135" class="x" fill="#dcfce7" stroke="#16a34a"/><text x="1190" y="210" text-anchor="middle" class="t b">Leaf Certificate</text><text x="1190" y="244" text-anchor="middle" class="t s">SAN: api.example.com</text><text x="1190" y="274" text-anchor="middle" class="t s">EKU: serverAuth</text>
  <rect x="90" y="380" width="1260" height="250" class="x" fill="#fff" stroke="#cbd5e1"/><text x="125" y="425" class="t b">客户端路径验证</text>
  <text x="150" y="480" class="t s">① 目标主机名是否匹配 Leaf SAN</text><text x="150" y="520" class="t s">② Leaf 是否由 Intermediate 公钥验证</text><text x="150" y="560" class="t s">③ Intermediate 是否由本地 Root Trust Anchor 验证</text><text x="150" y="600" class="t s">④ 每级有效期、Basic Constraints、Key Usage、EKU、算法与策略是否满足</text>
  <rect x="920" y="445" width="350" height="120" class="x" fill="#fee2e2" stroke="#dc2626"/><text x="1095" y="485" text-anchor="middle" class="t b">服务端不应发送</text><text x="1095" y="520" text-anchor="middle" class="t s">Root CA 私钥 / Leaf 私钥</text><text x="1095" y="550" text-anchor="middle" class="t s">发送根证书也不会自动受信任</text>
  <text x="720" y="700" text-anchor="middle" class="t b">常见服务端链：Leaf + Intermediate；常见客户端信任：Root CA</text>
</svg>
