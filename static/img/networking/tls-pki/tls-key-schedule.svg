  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><style>.t{font-family:Inter,'Microsoft YaHei',sans-serif;fill:#102a43}.h{font-size:34px;font-weight:700}.b{font-size:22px;font-weight:600}.s{font-size:18px;fill:#486581}.x{rx:16;stroke-width:2}.l{stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style></defs>
